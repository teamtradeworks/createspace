<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEM range ads</title>
<style>
  @font-face { font-family: "Outfit"; src: url("outfit.ttf") format("truetype"); font-weight: 100 900; }
  :root { --navy: #0c1446; --ink: #0c1446; --muted: rgb(12 20 70 / 0.64); --ground: #eef0f6; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: "Outfit", sans-serif; padding: 56px 16px 80px; }
  ::selection { background: #ffd500; color: var(--navy); }
  header { max-width: 1180px; margin: 0 auto 40px; }
  h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  header p { margin-top: 12px; font-size: 18px; color: var(--muted); max-width: 62ch; line-height: 1.45; }
  .grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; }
  figure { margin: 0; }
  .frame { aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px -18px rgb(12 20 70 / 0.45); background: #fff; }
  .frame img { width: 100%; height: 100%; display: block; }
  figcaption { margin-top: 16px; }
  figcaption b { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  figcaption p { margin-top: 4px; font-size: 16px; line-height: 1.45; color: var(--muted); }
  figcaption a { display: inline-block; margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--navy); text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid #3cc7f7; outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>STEM range ads</h1>
  <p>Three Meta feed concepts at 1080 × 1350 (4:5). Each shows all six categories with real kit photography. Evergreen: no discount or end date.</p>
</header>
<main class="grid">
  <figure>
    <div class="frame"><img src="export/ad-a-week.png" alt="Ad A: Robots on Monday, rockets by Friday. A week planner with one STEM activity per day."></div>
    <figcaption><b>A · The week</b><p>Activity-led. One hands-on thing per day, Monday to Saturday.</p><a href="export/ad-a-week.png" download>Download PNG</a></figcaption>
  </figure>
  <figure>
    <div class="frame"><img src="export/ad-b-curious.png" alt="Ad B: What kind of curious is yours? Six photos of kids, each tagged with a type such as the coder or the stargazer."></div>
    <figcaption><b>B · Kinds of curious</b><p>Child-led. The parent spots their own kid in one of six types.</p><a href="export/ad-b-curious.png" download>Download PNG</a></figcaption>
  </figure>
  <figure>
    <div class="frame"><img src="export/ad-c-specimens.png" alt="Ad C: Pick a science. Any science. Six real kits laid out on white, each labelled with its category."></div>
    <figcaption><b>C · Pick a science</b><p>Product-led. Six real kits laid out and labelled.</p><a href="export/ad-c-specimens.png" download>Download PNG</a></figcaption>
  </figure>
</main>
</body>
</html>
