<!DOCTYPE html>
<!--
  Ad brief N4: a parent's notes-app checklist, Meta feed portrait (1080 x 1350).
  The note is deliberately generic (cream paper, DM Sans, mustard tint, no app
  branding) so it reads as the parent's own phone. Only the stuck-on photo of
  the box and the small wordmark are ours.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Notes checklist</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("../../creative/kit/fonts/DMSans.ttf") format("truetype");
      font-weight: 100 1000;
      font-display: block;
    }

    :root {
      --paper: #fffdf3;
      --ink: #1b1a17;
      --ink-soft: #8a8679;
      --done: #8f8b7e;
      --rule: #efe9d6;
      --mustard: #d6a21c;
      --mustard-ink: #a77a06;
      --ui: "DM Sans", sans-serif;
    }

    body { background: var(--paper); }

    .canvas {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui);
      font-optical-sizing: auto;
    }

    .back {
      position: absolute;
      top: 70px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 34px;
      font-weight: 500;
      color: var(--mustard-ink);
    }

    .note {
      position: absolute;
      top: 160px;
      left: 72px;
      right: 72px;
    }

    .note h1 {
      font-size: 58px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .edited {
      margin-top: 18px;
      font-size: 26px;
      color: var(--ink-soft);
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 40px 0 0;
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 28px;
      min-height: 90px;
      border-bottom: 2px solid var(--rule);
      font-size: 42px;
      letter-spacing: -0.01em;
    }

    .list li:last-child { border-bottom: 0; }

    .tick {
      flex: none;
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--mustard);
      color: #fff;
    }

    .done span {
      color: var(--done);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(143, 139, 126, 0.8);
    }

    .todo .tick {
      background: transparent;
      box-shadow: inset 0 0 0 3px var(--mustard);
    }

    .todo span { color: var(--ink); font-weight: 500; }

    .caret {
      display: inline-block;
      width: 3px;
      height: 48px;
      margin-left: 4px;
      vertical-align: -9px;
      border-radius: 2px;
      background: var(--mustard);
    }

    /* The box, printed and stuck onto the note. */
    .photo {
      position: absolute;
      right: 80px;
      bottom: 70px;
      width: 440px;
      padding: 18px 18px 22px;
      background: #fff;
      border-radius: 6px;
      transform: rotate(-4deg);
      box-shadow:
        0 1px 2px rgba(60, 48, 20, 0.10),
        0 18px 36px -12px rgba(60, 48, 20, 0.30);
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .photo p {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 600;
      white-space: nowrap;
      line-height: 1.25;
      letter-spacing: -0.01em;
      text-align: center;
      color: var(--ink);
    }

    .tape {
      position: absolute;
      top: -22px;
      left: 50%;
      width: 150px;
      height: 44px;
      margin-left: -75px;
      background: rgba(242, 214, 130, 0.62);
      transform: rotate(3deg);
      box-shadow: 0 1px 2px rgba(60, 48, 20, 0.08);
    }

    .wordmark {
      position: absolute;
      left: 72px;
      bottom: 72px;
      width: 240px;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="back">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Notes
    </div>

    <article class="note">
      <h1>Things Liam (7) built these holidays</h1>
      <p class="edited">Edited today</p>

      <ul class="list">
        <li class="done"><i class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>a robot dog</span></li>
        <li class="done"><i class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>a crane that actually lifts things</span></li>
        <li class="done"><i class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>a dinosaur (it walks, apparently)</span></li>
        <li class="done"><i class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>a car he coded himself</span></li>
        <li class="todo"><i class="tick"></i><span>about 196 more to go<i class="caret"></i></span></li>
      </ul>
    </article>

    <figure class="photo">
      <i class="tape" aria-hidden="true"></i>
      <img src="images/makerzoid-robot-master-premium-box.jpg" alt="Makerzoid Robot Master Premium box">
      <p>Robot Master Premium, 200+ builds</p>
    </figure>

    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
  </main>
</body>
</html>
