<!DOCTYPE html>
<!--
  Ad brief G3: "This one has 72 robots in it." Meta story (1080 x 1920).
  Gifting and durability. The struck-through line names the gift that gets
  put away; the headline answers it with the 72 builds. Layout pinned by the
  brief: white ground, navy type, product on a pale blue card bleeding off the
  right edge, red CTA pill.
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>This one has 72 robots in it</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="g3-ad.css">
  <script src="../../creative/kit/canvas.js"></script>
</head>
<body>
  <main class="canvas">
    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">

    <p class="struck">
      <span>Opened on Christmas morning.</span>
      <span>In the cupboard by Boxing Day.</span>
    </p>

    <h1>
      <span>This one has <span class="marker">72</span></span>
      <span>robots in it.</span>
    </h1>

    <p class="body">Build one, take it apart, build the next.<br>300 pieces, no screen needed.</p>

    <div class="card">
      <img src="images/makerzoid-smart-robot-box-and-builds.jpg" alt="Makerzoid Smart Robot box with a built robot drummer and eleven other robot builds around it">
    </div>

    <div class="footer">
      <div>
        <p class="product">Makerzoid Smart Robot, ages 6+</p>
        <p class="price"><b>R 980</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop gifts</span>
    </div>
  </main>
</body>
</html>
