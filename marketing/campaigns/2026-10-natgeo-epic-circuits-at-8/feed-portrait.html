<!DOCTYPE html>
<!--
  Ad brief A4: "Real circuits at 8." Meta feed portrait (1080 x 1350).
  Age and skill series (A1-A6). The layout lives in age-series.css and stays
  identical across the series; this ad sets the blue accent, its copy, the
  Epic Circuits box shot, and a co-brand lockup in place of the wordmark.
  National Geographic licensor review before launch (see brief.md).
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Real circuits at 8</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="age-series.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --accent: var(--cs-blue);
    }

    /* Co-brand lockup: wordmark, hairline, partner name set in Outfit.
       Text only; the National Geographic logo appears on the box alone. */
    .lockup {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .lockup .wordmark {
      height: 38px;
    }

    .lockup .rule {
      width: 2px;
      height: 38px;
      background: rgba(255, 255, 255, 0.45);
    }

    .partner {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <div class="lockup">
        <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
        <span class="rule" aria-hidden="true"></span>
        <p class="partner">NATIONAL GEOGRAPHIC</p>
      </div>
      <p class="series">Ages 8-14</p>
    </div>

    <h1>
      <span>Real circuits</span>
      <span>at <span class="age">8</span>.</span>
    </h1>

    <p class="body">Wire up lights, a mini vacuum and a copter that launches. Then work out why the next one won't switch on.</p>

    <ul class="pills">
      <li>Ages 8-14</li>
      <li>40+ circuit projects</li>
      <li>Officially licensed</li>
    </ul>

    <div class="card">
      <img src="images/epic-circuits-box-white.jpg" alt="National Geographic Epic Circuits Science Kit box, showing the battery block, switches, fan, RGB light and launching copter">
    </div>

    <div class="footer">
      <div>
        <p class="product">National Geographic Epic Circuits</p>
        <p class="price"><b>R 970</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop now</span>
    </div>
  </main>
</body>
</html>
