<!DOCTYPE html>
<!--
  Instagram feed post (4:5): Ultimate Mega 2560 and Ultimate UNO R3 starter kits back in stock.
  Render: marketing/scripts/render.sh marketing/campaigns/2026-11-ultimate-starter-kits-back/ig-portrait.html
  Exports at 1080 x 1350, Instagram's portrait feed size.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Ultimate starter kits are back</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      color: var(--cs-white);
      isolation: isolate;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
    }
    .glow--orange {
      width: 620px; height: 380px;
      left: -160px; top: 120px;
      background: rgba(255, 139, 0, 0.2);
    }
    .glow--blue {
      width: 620px; height: 420px;
      right: -180px; top: 300px;
      background: rgba(60, 199, 247, 0.2);
    }

    .top {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* Partner logos sit on white */
    .brand {
      background: var(--cs-white);
      border-radius: 20px;
      padding: 12px 22px;
      box-shadow: 0 10px 30px rgba(4, 8, 30, 0.35);
    }
    .brand img {
      display: block;
      height: 64px;
      width: auto;
    }
    .pill {
      padding: 12px 28px 14px;
      border-radius: 9999px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .headline {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 180px;
      margin: 0;
      font-weight: 600;
      font-size: 128px;
      line-height: 0.98;
      letter-spacing: -0.03em;
    }
    .headline em {
      font-style: normal;
      color: var(--cs-orange);
    }

    .sub {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 452px;
      margin: 0;
      font-size: 38px;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Two product cards, side by side */
    .kits {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 580px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
    }
    .kit {
      background: var(--cs-white);
      color: var(--cs-navy);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(4, 8, 30, 0.5);
      display: flex;
      flex-direction: column;
    }
    .kit__photo {
      position: relative;
      height: 430px;
      background: var(--cs-white);
    }
    .kit__photo img {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 58px;
      bottom: 0;
      width: calc(100% - 16px);
      height: calc(100% - 58px);
      object-fit: contain;
      object-position: 50% 60%;
      transform: scale(1.06);
    }
    .kit__board {
      position: absolute;
      left: 24px;
      top: 22px;
      padding: 8px 20px 10px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.02em;
      color: var(--cs-navy);
    }
    .kit--mega .kit__board { background: var(--cs-orange); }
    .kit--uno  .kit__board { background: var(--cs-blue); }

    .kit__body {
      padding: 22px 28px 28px;
      border-top: 3px solid #eef0f5;
    }
    .kit__name {
      margin: 0;
      font-weight: 600;
      font-size: 40px;
      line-height: 1.08;
      letter-spacing: -0.01em;
    }
    .kit__meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 16px;
    }
    .kit__price {
      font-weight: 700;
      font-size: 44px;
    }

    .footer {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 52px;
      display: flex;
      justify-content: space-between;
      font-size: 30px;
      color: rgba(255, 255, 255, 0.85);
    }
    .footer b {
      font-weight: 600;
      color: var(--cs-yellow);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow glow--orange"></div>
    <div class="glow glow--blue"></div>

    <div class="top">
      <div class="brand"><img src="images/brands/robotico.png" alt="Robotico"></div>
      <span class="pill">Back in stock</span>
    </div>

    <h1 class="headline">Ultimate kits<br>are <em>back!</em></h1>

    <p class="sub">Real circuits, real code. 33 lessons, no soldering, everything in one box.</p>

    <div class="kits">
      <article class="kit kit--mega">
        <div class="kit__photo">
          <img src="images/mega-2560-kit-open-box.jpg" alt="The Ultimate Mega 2560 Starter Kit, open, showing its board and components">
          <span class="kit__board">MEGA 2560</span>
        </div>
        <div class="kit__body">
          <h2 class="kit__name">Ultimate Mega 2560 Starter Kit</h2>
          <div class="kit__meta">
            <span class="kit__price">R 1,500</span>
          </div>
        </div>
      </article>

      <article class="kit kit--uno">
        <div class="kit__photo">
          <img src="images/uno-r3-kit-open-box.jpg" alt="The Ultimate UNO R3 Starter Kit, open, showing its board and components">
          <span class="kit__board">UNO R3</span>
        </div>
        <div class="kit__body">
          <h2 class="kit__name">Ultimate UNO R3 Starter Kit</h2>
          <div class="kit__meta">
            <span class="kit__price">R 1,300</span>
          </div>
        </div>
      </article>
    </div>

    <div class="footer">
      <span>Arduino compatible</span>
      <span><b>Shop now</b> via the link in bio</span>
    </div>
  </main>
</body>
</html>
