<!DOCTYPE html>
<!--
  Instagram feed post (4:5) version of email-square.html: "Join us at CREATESPACE".
  Render: marketing/scripts/render.sh marketing/campaigns/2026-10-join-us-email/ig-portrait.html
  Exports at 1080 x 1350, Instagram's portrait feed size.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Join us at CREATESPACE</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      color: var(--cs-white);
      isolation: isolate;
    }

    /* Light, not shadow: blue and purple glows behind the centre */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
    }
    .glow--blue {
      width: 620px; height: 420px;
      left: 140px; top: 295px;
      background: rgba(60, 199, 247, 0.22);
    }
    .glow--purple {
      width: 520px; height: 380px;
      left: 420px; top: 395px;
      background: rgba(172, 77, 255, 0.2);
    }

    .sky {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .orbit {
      fill: none;
      stroke: rgba(255, 255, 255, 0.26);
      stroke-width: 3;
    }
    .orbit--outer {
      stroke: rgba(255, 255, 255, 0.11);
      stroke-dasharray: 3 14;
      stroke-linecap: round;
      stroke-width: 4;
    }

    .piece {
      position: absolute;
      display: block;
      height: auto;
    }
    .saturn { width: 360px; left: 730px; top: 40px; transform: rotate(-10deg); }
    .moon   { width: 104px; left: 92px;  top: 170px; }
    .earth  { width: 270px; left: -64px; top: 880px; transform: rotate(8deg); }
    .robot  { width: 236px; left: 800px; top: 826px; }
    /* centred on the inner orbit: code at t=130deg, nut at t=-10deg */
    .code   { width: 140px; left: 224px; top: 735px; transform: rotate(-12deg); }
    .nut    { width: 104px; left: 913px; top: 337px; transform: rotate(14deg); }

    /* the stretch of inner orbit that passes in front of the nut */
    .sky--front { z-index: 1; pointer-events: none; }
    .lockup { z-index: 2; }

    .lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 397px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .lockup h1 {
      margin: 0;
      font-weight: 600;
      font-size: 86px;
      line-height: 1;
      letter-spacing: -0.025em;
    }
    .lockup h1 {
      display: flex;
      align-items: center;
      gap: 26px;
    }
    /* "Join us" dressed as the email's call to action */
    .cta {
      position: relative;
      display: inline-block;
      padding: 14px 40px 20px;
      border-radius: 18px;
      background: var(--cs-orange);
      color: var(--cs-white);
      box-shadow: 0 14px 30px rgba(4, 8, 30, 0.45);
    }
    .cta .cursor {
      position: absolute;
      right: -30px;
      bottom: -40px;
      width: 58px;
      height: auto;
    }
    .lockup .logo {
      display: block;
      width: 760px;
      height: auto;
    }

    /* White strip of the brands we stock */
    .brands {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 290px;
      z-index: 3;
      background: var(--cs-white);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      align-items: center;
      justify-items: center;
      padding: 34px 48px;
      gap: 18px 28px;
    }
    .brands img {
      display: block;
      max-width: calc(150px * var(--s, 1));
      max-height: calc(72px * var(--s, 1));
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow glow--blue"></div>
    <div class="glow glow--purple"></div>

    <svg class="sky" viewBox="0 0 1080 1350" aria-hidden="true">
      <g id="stars"></g>
      <ellipse class="orbit orbit--outer" cx="540" cy="555" rx="640" ry="395" transform="rotate(-14 540 555)"/>
      <ellipse class="orbit" cx="540" cy="535" rx="455" ry="225" transform="rotate(-14 540 535)"/>
    </svg>

    <img class="piece saturn" src="../../creative/kit/illustrations/planet-1.svg" alt="">
    <img class="piece moon" src="../../creative/kit/illustrations/planet-2.svg" alt="">
    <img class="piece code" src="../../creative/kit/illustrations/code-1.svg" alt="">
    <img class="piece nut" src="../../creative/kit/illustrations/nut-2.svg" alt="">
    <img class="piece earth" src="../../creative/kit/illustrations/earth.svg" alt="">
    <img class="piece robot" src="../../creative/kit/illustrations/robot-4.svg" alt="">

    <svg class="sky sky--front" viewBox="0 0 1080 1350" aria-hidden="true">
      <clipPath id="nut-front"><rect x="909" y="325" width="70" height="120"/></clipPath>
      <g clip-path="url(#nut-front)">
        <ellipse class="orbit" cx="540" cy="535" rx="455" ry="225" transform="rotate(-14 540 535)"/>
      </g>
    </svg>

    <div class="lockup">
      <h1>
        <span class="cta">Join us<svg class="cursor" viewBox="0 0 24 30" aria-hidden="true"><path d="M2 2 L2 24 L8 18.5 L12.2 27.5 L16 25.8 L11.8 17 L20 17 Z" fill="#fff" stroke="#0c1446" stroke-width="2" stroke-linejoin="round"/></svg></span>
        <span>at</span>
      </h1>
      <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
    </div>
    <div class="brands">
      <img src="images/brands/matatastudio.png" alt="MatataStudio">
      <img src="images/brands/makerzoid.png" alt="Makerzoid" style="--s:1.05">
      <img src="images/brands/bbc-microbit.png" alt="BBC micro:bit">
      <img src="images/brands/elecfreaks.png" alt="ELECFREAKS" style="--s:1.08">
      <img src="images/brands/snap-circuits.png" alt="Snap Circuits" style="--s:1.08">
      <img src="images/brands/arduino.png" alt="Arduino">
      <img src="images/brands/national-geographic.png" alt="National Geographic" style="--s:1.08">
      <img src="images/brands/blockaroo.png" alt="Blockaroo" style="--s:1.15">
      <img src="images/brands/nasa.png" alt="NASA" style="--s:1.05">
      <img src="images/brands/robotico.png" alt="Robotico">
    </div>
  </main>

  <script>
    // A fixed, seeded star field so every render is identical.
    (function () {
      var seed = 7;
      function rand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }
      var g = document.getElementById("stars");
      var ns = "http://www.w3.org/2000/svg";
      for (var i = 0; i < 90; i++) {
        var x = rand() * 1080;
        var y = rand() * 1350;
        // keep the headline area calm
        if (y > 1050 || (x > 170 && x < 910 && y > 375 && y < 695)) continue;
        var c = document.createElementNS(ns, "circle");
        var big = rand() > 0.85;
        var far = !big && rand() > 0.5;
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", big ? 3.2 : far ? 1.2 : 2);
        c.setAttribute("fill", "#fff");
        c.setAttribute("opacity", (big ? 0.7 : 0.25 + rand() * 0.35).toFixed(2));
        g.appendChild(c);
      }
    })();
  </script>
</body>
</html>
