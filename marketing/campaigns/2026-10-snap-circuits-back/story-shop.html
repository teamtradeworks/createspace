<!DOCTYPE html>
<!--
  Instagram story (9:16): Snap Circuits logo and kit photos, no text.
  The navy band between the photos and the bottom safe zone is left clear
  for a "Shop Snap Circuits" link sticker added in Instagram.
  Render: marketing/scripts/render.sh marketing/campaigns/2026-10-snap-circuits-back/story-shop.html
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>Snap Circuits story</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      isolation: isolate;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
    }
    .glow--blue   { width: 760px; height: 620px; left: -260px; top: 520px;  background: rgba(60, 199, 247, 0.24); }
    .glow--purple { width: 720px; height: 620px; right: -260px; top: 900px; background: rgba(172, 77, 255, 0.26); }
    .glow--red    { width: 620px; height: 300px; left: 230px; top: 250px;   background: rgba(247, 11, 40, 0.16); }

    /* Partner logo on white, below Instagram's top 270px */
    .logo {
      position: absolute;
      left: 50%;
      top: 318px;
      transform: translateX(-50%);
      background: var(--cs-white);
      border-radius: 36px;
      padding: 34px 48px;
      box-shadow: 0 24px 60px rgba(4, 8, 30, 0.5);
    }
    .logo img {
      display: block;
      width: 560px;
      height: auto;
    }

    /* Photo cards */
    .card {
      position: absolute;
      background: var(--cs-white);
      padding: 14px;
      border-radius: 34px;
      box-shadow: 0 30px 70px rgba(4, 8, 30, 0.55);
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
    }
    .card--main {
      left: 110px;
      top: 590px;
      width: 860px;
      height: 620px;
      transform: rotate(-3deg);
      z-index: 1;
    }
    .card--main img { object-position: 50% 60%; }
    .card--left {
      left: 50px;
      top: 1110px;
      width: 470px;
      height: 440px;
      transform: rotate(-6deg);
      z-index: 2;
    }
    .card--left img { object-position: 50% 40%; }
    .card--right {
      right: 50px;
      top: 1080px;
      width: 470px;
      height: 470px;
      transform: rotate(5deg);
      z-index: 3;
    }
    .card--right img { object-position: 50% 20%; }

    /* Snap Circuits style wire pieces as decoration */
    .wire {
      position: absolute;
      z-index: 0;
    }
    .wire--top    { left: -24px;  top: 500px;  width: 240px; transform: rotate(-26deg); }
    .wire--side   { right: -24px; top: 500px;  width: 240px; transform: rotate(26deg); }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow glow--blue"></div>
    <div class="glow glow--purple"></div>
    <div class="glow glow--red"></div>

    <svg style="position:absolute;width:0;height:0" aria-hidden="true">
      <defs>
        <radialGradient id="stud" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#c9ced8"/>
          <stop offset="100%" stop-color="#7d8496"/>
        </radialGradient>
        <symbol id="wire" viewBox="0 0 520 70">
          <rect x="2" y="7" width="516" height="56" rx="28" fill="currentColor"/>
          <line x1="44" y1="35" x2="476" y2="35" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
          <circle cx="35" cy="35" r="18" fill="url(#stud)" stroke="#5c6377" stroke-width="2"/>
          <circle cx="485" cy="35" r="18" fill="url(#stud)" stroke="#5c6377" stroke-width="2"/>
        </symbol>
      </defs>
    </svg>
    <svg class="wire wire--top" viewBox="0 0 520 70" style="color: var(--cs-blue)" aria-hidden="true"><use href="#wire"/></svg>
    <svg class="wire wire--side" viewBox="0 0 520 70" style="color: var(--cs-green)" aria-hidden="true"><use href="#wire"/></svg>

    <div class="logo"><img src="images/brands/snap-circuits.png" alt="Snap Circuits"></div>

    <div class="card card--main">
      <img src="images/snap-circuits-my-home-kids-building.jpg" alt="Two children building the Snap Circuits My Home kit">
    </div>
    <div class="card card--left">
      <img src="images/snap-circuits-beginner-glowing-board.jpg" alt="A child pressing a switch on a glowing Snap Circuits Beginner board">
    </div>
    <div class="card card--right">
      <img src="images/snap-circuits-classic-300-girl-smiling.jpg" alt="A girl smiling while building with Snap Circuits Classic 300">
    </div>
  </main>
</body>
</html>
