<!DOCTYPE html>
<!--
  Ad brief A1: "Coding at 3. Before they can read." Meta story (1080 x 1920).
  Age and skill series (A1-A6). The layout lives in age-series.css and stays
  identical across the series; this ad sets the blue accent, its copy and
  the Tale-Bot Pro photo.
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>Coding at 3</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="age-series.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --accent: var(--cs-blue);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
      <p class="series">Early explorers 3-5</p>
    </div>

    <h1>
      <span>Coding at <span class="age">3</span>.</span>
      <span>Before they can read.</span>
    </h1>

    <p class="body">Press the arrow buttons and Tale-Bot walks the route they planned. No tablet, no app, no reading.</p>

    <ul class="pills">
      <li>Ages 3-6</li>
      <li>14 missions + 5 maps</li>
      <li>Screen-free</li>
    </ul>

    <div class="card">
      <img src="images/talebot-pro-three-bots-white.jpg" alt="Three MatataStudio Tale-Bot Pro robots with arm, Lego plate and beak attachments">
    </div>

    <div class="footer">
      <div>
        <p class="product">MatataStudio Tale-Bot Pro</p>
        <p class="price"><b>R 2,280</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop now</span>
    </div>
  </main>
</body>
</html>
