<!DOCTYPE html>
<!--
  Ad brief G2: "For the grandchild who's curious about everything."
  Meta feed portrait (1080 x 1350), gifting, for a 55+ ad set.
  Warm cream ground and type set larger than our usual feed ads so older
  readers can take it in at phone size. Navy text throughout; yellow only as
  the highlighter band, red only on the CTA.
  NASA marks appear on the product photo: needs licensor review before launch.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>For the grandchild who's curious about everything</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --cream: #fbf6ec;
      --margin: 72px;
      --rule: rgba(12, 20, 70, 0.14);
    }

    .canvas {
      display: flex;
      flex-direction: column;
      padding: var(--margin);
      background: var(--cream);
      color: var(--cs-navy);
      font-family: var(--cs-font);
      overflow: hidden;
    }

    .wordmark {
      display: block;
      align-self: flex-start;
      height: 40px;
      width: auto;
    }

    h1 {
      position: relative;
      z-index: 0;
      margin: 56px 0 0;
      font-size: 96px;
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    /* Highlighter band: sits behind the lower two thirds of the word,
       tilted a touch so it reads as drawn by hand */
    .mark {
      position: relative;
      white-space: nowrap;
    }

    .mark::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -0.1em;
      right: -0.12em;
      top: 0.36em;
      bottom: 0.02em;
      background: var(--cs-yellow);
      border-radius: 0.08em 0.14em 0.1em 0.16em;
      transform: rotate(-1.4deg);
    }

    /* Left column (body + ticks) beside the telescope circle */
    .middle {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 530px;
      gap: 16px;
      align-items: center;
      margin-top: 36px;
    }

    .body {
      margin: 0;
      font-size: 34px;
      font-weight: 400;
      line-height: 1.32;
      text-wrap: pretty;
    }

    .ticks {
      margin: 40px 0 0;
      padding: 0;
      list-style: none;
    }

    .ticks li {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .ticks li + li {
      margin-top: 22px;
    }

    .ticks svg {
      flex: none;
      width: 44px;
      height: 44px;
    }

    .circle {
      position: relative;
      width: 530px;
      height: 530px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--cs-white);
      box-shadow: 0 18px 40px -18px rgba(12, 20, 70, 0.28);
    }

    .circle img {
      position: absolute;
      left: 50%;
      top: 50%;
      height: 84%;
      width: auto;
      transform: translate(-50%, -49%);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      margin-top: 36px;
      padding-top: 32px;
      border-top: 2px solid var(--rule);
    }

    .product {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
    }

    .price {
      margin: 8px 0 0;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.2;
    }

    .price b {
      font-weight: 700;
    }

    .cta {
      flex: none;
      padding: 22px 48px 24px;
      border-radius: 9999px;
      background: var(--cs-red);
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      color: var(--cs-white);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">

    <h1>For the grandchild who's curious about <span class="mark">everything.</span></h1>

    <div class="middle">
      <div>
        <p class="body">A real telescope for ages&nbsp;8+. Craters on the moon, from your own garden.</p>

        <ul class="ticks">
          <li>
            <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#93DB21"/><path d="M13 22.5l6 6 12-13" fill="none" stroke="#0C1446" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Officially licensed NASA
          </li>
          <li>
            <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#93DB21"/><path d="M13 22.5l6 6 12-13" fill="none" stroke="#0C1446" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Delivered in 1-3 days
          </li>
          <li>
            <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#93DB21"/><path d="M13 22.5l6 6 12-13" fill="none" stroke="#0C1446" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            30-day easy returns
          </li>
        </ul>
      </div>

      <div class="circle">
        <img src="images/nasa-lunar-telescope-white.jpg" alt="NASA Lunar Telescope on its tripod">
      </div>
    </div>

    <div class="footer">
      <div>
        <p class="product">NASA Lunar Telescope</p>
        <p class="price"><b>R 1,150</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop gifts</span>
    </div>
  </main>
</body>
</html>
