<!DOCTYPE html>
<!--
  Ad brief A6: "Lab coat on at 5." Meta story (1080 x 1920).
  Age and skill series (A1-A6). The layout lives in age-series.css and stays
  identical across the series; this ad sets the orange accent, its copy, the
  Junior Chemistry Lab box shot, and the co-brand lockup from A4.
  National Geographic licensor review before launch (see brief.md).
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>Lab coat on at 5</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="age-series.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --accent: var(--cs-orange);
    }

    /* Co-brand lockup: wordmark, hairline, partner name set in Outfit.
       Text only; the National Geographic logo appears on the box alone. */
    .lockup {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .lockup .wordmark {
      height: 38px;
    }

    .lockup .rule {
      width: 2px;
      height: 38px;
      background: rgba(255, 255, 255, 0.45);
    }

    .partner {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <div class="lockup">
        <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
        <span class="rule" aria-hidden="true"></span>
        <p class="partner">NATIONAL GEOGRAPHIC</p>
      </div>
      <p class="series">Ages 4-8</p>
    </div>

    <h1>
      <span>Lab coat on</span>
      <span>at <span class="age">5</span>.</span>
    </h1>

    <p class="body">25 experiments sized for little hands: measure, pour, mix and watch what happens. Questions guaranteed.</p>

    <ul class="pills">
      <li>Ages 4-8</li>
      <li>25 experiments</li>
      <li>Officially licensed</li>
    </ul>

    <div class="card">
      <img src="images/junior-chemistry-lab-white.jpg" alt="National Geographic Kids Junior Chemistry Lab Kit box with its beakers, flasks, test tubes in a stand, droppers, funnel, measuring spoons and safety goggles">
    </div>

    <div class="footer">
      <div>
        <p class="product">National Geographic Junior Chemistry Lab</p>
        <p class="price"><b>R 570</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop now</span>
    </div>
  </main>
</body>
</html>
