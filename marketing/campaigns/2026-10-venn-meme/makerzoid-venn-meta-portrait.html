<!DOCTYPE html>
<html lang="en-ZA" data-canvas="meta-portrait">

  <link rel="stylesheet" href="venn.css">
</head>
<body>
  <main class="canvas">

    <svg class="venn" viewBox="0 0 1080 1350" aria-hidden="true">

      <circle class="hub" cx="540" cy="598" r="188"/>

    <p class="label label--tl">They're busy for hours</p>

    <div class="product"><img src="images/makerzoid-robot-master-premium-box.jpg" alt="Makerzoid Robot Master Premium"></div>

    <div class="caption">
      <h2>Makerzoid Robot Master Premium</h2>
      <p>200+ robots to build, then code. Ages 6-14.</p>
