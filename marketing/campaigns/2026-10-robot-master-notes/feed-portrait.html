<!DOCTYPE html>
<!--
  Robot Master Premium, "Things Liam built" notes checklist. A generic notes
  screen, built to read as a parent's own screenshot. Not modelled on any one
  notes app. Brief: brief.md in this folder.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Robot Master Premium, notes checklist (feed portrait)</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="notes.css">
</head>
<body>
  <main class="canvas">
    <header class="bar">
      <svg class="back" viewBox="0 0 26 44" aria-hidden="true">
        <path d="M21 4 5 22l16 18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Notes</span>
    </header>

    <div class="note">
      <h1 class="title">Things Liam (7) built these holidays</h1>
      <p class="edited">Edited today</p>

      <ul class="list">
        <li class="done">a robot dog</li>
        <li class="done">a crane that actually lifts things</li>
        <li class="done">a dinosaur (it walks, apparently)</li>
        <li class="done">a car he coded himself</li>
        <li>about 196 more to go<span class="caret" aria-hidden="true"></span></li>
      </ul>
    </div>

    <figure class="snap">
      <img src="images/robot-master-kit-and-builds.jpg" alt="Makerzoid Robot Master Premium box, sorting tray, course books and three finished robot builds">
      <figcaption>Robot Master Premium, 200+ builds</figcaption>
    </figure>

    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
  </main>
</body>
</html>
