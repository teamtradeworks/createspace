<!DOCTYPE html>
<!--
  Ad brief C2 follow-up: the reveal, Meta feed portrait (1080 x 1350).
  Posted on Friday after feed-portrait.html. Same yellow layout; the "No
  peeking!" tape has been peeled off the box and stuck on the card's corner,
  and an orange arrow points at the "200+ IN 1" it was hiding.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Guess how many reveal</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    body { background: var(--cs-yellow); }

    .canvas {
      display: flex;
      flex-direction: column;
      padding: 72px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
    }

    .wordmark {
      display: block;
      width: 300px;
      height: auto;
    }

    h1 {
      margin: 44px 0 0;
      font-size: 104px;
      font-weight: 800;
      line-height: 0.96;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    h1 .num {
      display: block;
      font-size: 164px;
      line-height: 0.86;
      letter-spacing: -0.045em;
    }

    .sub {
      margin: 26px 0 0;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.3;
    }

    .stage {
      position: relative;
      flex: 1;
      display: grid;
      place-items: end center;
      padding-bottom: 14px;
    }

    .card {
      position: relative;
      width: 730px;
      padding: 32px;
      background: var(--cs-white);
      border-radius: 28px;
      transform: rotate(-3deg);
      box-shadow:
        0 2px 4px rgba(12, 20, 70, 0.10),
        0 28px 56px -18px rgba(12, 20, 70, 0.38);
    }

    .box {
      position: relative;
    }

    .box img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* The "No peeking!" tape, peeled off the box and stuck on the card. */
    .tape {
      position: absolute;
      left: -46px;
      top: 26px;
      width: 230px;
      padding: 12px 0 14px;
      background: url("images/masking-tape.png") center / 100% 100% no-repeat;
      transform: rotate(-38deg);
      filter: drop-shadow(0 2px 3px rgba(60, 48, 20, 0.28));
      font-size: 27px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      color: var(--cs-navy);
    }

    /* Hand-drawn arrow pointing at the "200+ IN 1" printed on the box. */
    .arrow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .badge {
      position: absolute;
      top: -44px;
      right: -82px;
      display: grid;
      place-items: center;
      width: 214px;
      height: 214px;
      border-radius: 50%;
      background: var(--cs-navy);
      color: var(--cs-white);
      transform: rotate(13deg); /* 10deg on the page, after the card's -3deg */
      box-shadow: 0 18px 36px -14px rgba(12, 20, 70, 0.55);
      font-size: 164px;
      font-weight: 800;
      line-height: 1;
    }

    .badge span { transform: translateY(-2px); }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 32px;
      padding-top: 26px;
      border-top: 3px solid var(--cs-navy);
      font-size: 30px;
      line-height: 1.2;
    }

    .foot .name { font-weight: 600; }
    .foot .ask { font-weight: 500; }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">

    <h1><span class="num">200+.</span> Yes, really.</h1>
    <p class="sub">Every one of them built from the 600+ pieces in this box.</p>

    <div class="stage">
      <figure class="card">
        <div class="box">
          <img src="images/makerzoid-robot-master-premium-box.jpg" alt="Makerzoid Robot Master Premium box, printed with 200+ in 1">
          <svg class="arrow" viewBox="0 0 100 86.28" aria-hidden="true">
            <g fill="none" stroke="#ff8b00" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
              <path d="M68.5 7.6 C 69.5 13, 66 16.4, 59.2 15.6" vector-effect="non-scaling-stroke"/>
              <path d="M61.6 12.9 L 58.9 15.6 L 62 17.6" vector-effect="non-scaling-stroke"/>
            </g>
          </svg>
        </div>
        <i class="tape">No peeking!</i>
        <div class="badge" aria-hidden="true"><span>!</span></div>
      </figure>
    </div>

    <footer class="foot">
      <span class="name">Makerzoid Robot Master Premium</span>
      <span class="ask">Did you guess right?</span>
    </footer>
  </main>
</body>
</html>
