<!DOCTYPE html>
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
<meta charset="UTF-8">
<title>CREATESPACE ad C: pick a science</title>
<link rel="stylesheet" href="../../creative/kit/brand.css">
<link rel="stylesheet" href="stem-range.css">
<script src="../../creative/kit/canvas.js"></script>
<style>
  .canvas { background: var(--cs-white); color: var(--cs-navy); }

  .top {
    position: absolute; left: 64px; right: 64px; top: 60px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .top img { height: 40px; width: auto; }
  .top .ages { font-size: 30px; color: rgb(12 20 70 / 0.85); }

  h1 {
    position: absolute; left: 64px; top: 138px;
    font-size: 112px; line-height: 0.95; font-weight: 600; letter-spacing: -0.04em;
  }

  /* field-guide board: two columns, three rows; each specimen is an object plus a leader-lined label */
  .board {
    position: absolute; left: 64px; right: 64px; top: 384px;
    display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 250px;
    column-gap: 40px;
  }
  .spec {
    display: grid; grid-template-columns: 216px 1fr; align-items: center;
    position: relative;
  }
  .spec .obj { width: 216px; height: 210px; }
  .spec .obj img {
    width: 100%; height: 100%; object-fit: contain;
    mix-blend-mode: multiply; /* studio shots on white: the backdrop drops onto the page */
  }
  .tag {
    position: relative;
    padding-left: 58px;
  }
  .tag::before { /* leader line from the object to the label */
    content: ""; position: absolute; left: -6px; top: 20px;
    width: 52px; height: 3px;
    background: var(--cs-navy);
  }
  .tag::after { /* category dot where the leader lands */
    content: ""; position: absolute; left: -12px; top: 13px;
    width: 17px; height: 17px; border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 0 3px var(--cs-navy);
  }
  .tag b { display: block; font-size: 32px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.05; }
  .tag span { display: block; margin-top: 8px; font-size: 26px; line-height: 1.2; color: rgb(12 20 70 / 0.8); }

  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 168px;
    background: var(--cs-navy); color: var(--cs-white);
    padding: 0 64px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .band .note { font-size: 28px; line-height: 1.3; color: rgb(255 255 255 / 0.85); }
  .band .note strong { color: var(--cs-white); font-weight: 600; }
</style>
</head>
<body>
<main class="canvas" aria-label="CREATESPACE: pick a science, any science">
  <div class="top">
    <img src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
    <span class="ages">Ages 3 to 13+</span>
  </div>

  <h1>Pick a science.<br>Any science.</h1>

  <section class="board" aria-label="Six STEM categories">
    <figure class="spec" style="--dot:var(--c-coding)">
      <div class="obj"><img src="images/obj-nous-robot.jpg" alt="MatataStudio Nous AI robot"></div>
      <figcaption class="tag"><b>Robotics &amp; Coding</b><span>MatataStudio Nous AI Set</span></figcaption>
    </figure>
    <figure class="spec" style="--dot:var(--c-circuits)">
      <div class="obj"><img src="images/obj-snap-classic-board.jpg" alt="Snap Circuits board with parts snapped together"></div>
      <figcaption class="tag"><b>Electronics &amp; Circuits</b><span>Snap Circuits Classic 300</span></figcaption>
    </figure>
    <figure class="spec" style="--dot:var(--c-building)">
      <div class="obj" style="width:250px; margin-left:-24px"><img src="images/obj-robot-master-builds.jpg" alt="Makerzoid Robot Master models and kit box"></div>
      <figcaption class="tag"><b>Building &amp; Mechanics</b><span>Makerzoid Robot Master</span></figcaption>
    </figure>
    <figure class="spec" style="--dot:var(--c-earth)">
      <div class="obj"><img src="images/obj-rock-specimens.jpg" alt="Rock and mineral specimens"></div>
      <figcaption class="tag"><b>Earth Sciences</b><span>Rock &amp; Mineral Starter Kit</span></figcaption>
    </figure>
    <figure class="spec" style="--dot:var(--c-space)">
      <div class="obj"><img src="images/obj-air-rockets-launcher.jpg" alt="Light-up air rockets and stomp launcher"></div>
      <figcaption class="tag"><b>Space &amp; Astronomy</b><span>Light-Up Air Rockets</span></figcaption>
    </figure>
    <figure class="spec" style="--dot:var(--c-chem)">
      <div class="obj"><img src="images/obj-volcano-kit.jpg" alt="Build Your Own Volcano kit contents"></div>
      <figcaption class="tag"><b>Chemistry</b><span>Build Your Own Volcano</span></figcaption>
    </figure>
  </section>

  <div class="band">
    <p class="note"><strong>Six kinds of STEM, one specialist.</strong><br>Free delivery over R 1,500.</p>
    <span class="cta">Shop all six</span>
  </div>
</main>
</body>
</html>
