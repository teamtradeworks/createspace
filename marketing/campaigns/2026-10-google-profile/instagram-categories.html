<!DOCTYPE html>
<!--
  Instagram feed post (4:5): the shop categories as a playful, colourful grid.
  Instagram's profile grid previews posts at 3:4, trimming ~34px from each
  side, so nothing important sits near the left or right edge.
  Categories match storefront/src/config/categories.ts.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>CREATESPACE categories Instagram</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      position: relative;
      overflow: hidden;
      background: var(--cs-navy);
      color: var(--cs-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 64px;
      text-align: center;
    }
    .canvas > :not(.bg):not(.peek) { position: relative; }

    /* Background: sparkles and two doodles peeking in */
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .peek { position: absolute; }

    .logo { width: 400px; height: auto; display: block; margin-bottom: 38px; }
    h1 {
      font-weight: 600;
      font-size: 92px;
      line-height: 1.02;
      letter-spacing: -0.015em;
      margin: 0;
    }
    h1 em { font-style: normal; color: var(--cs-yellow); }
    .sticker {
      display: inline-block;
      margin: 16px 0 48px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
      font-weight: 600;
      font-size: 60px;
      line-height: 1;
      padding: 16px 34px 20px;
      border-radius: 20px;
      transform: rotate(-3deg);
      box-shadow: 8px 8px 0 var(--cs-red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px 24px;
      width: 100%;
    }
    .tile {
      background: var(--bg);
      color: var(--ink, var(--cs-navy));
      border-radius: 28px;
      height: 264px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transform: rotate(var(--tilt, 0deg));
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.22);
    }
    .tile img { height: 124px; width: auto; max-width: 240px; display: block; }
    .tile span { font-size: 33px; font-weight: 600; line-height: 1.1; }

    .url {
      margin: 44px 0 0;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <svg class="bg" viewBox="0 0 1080 1350" aria-hidden="true">
      <g fill="none" stroke-linecap="round" stroke-width="6">
        <path d="M120 150 v34 M103 167 h34" stroke="#ffd500"/>
        <path d="M960 330 v28 M946 344 h28" stroke="#3cc7f7"/>
        <path d="M90 520 v24 M78 532 h24" stroke="#ac4dff"/>
        <path d="M1000 1230 v30 M985 1245 h30" stroke="#93db21"/>
        <path d="M150 1250 v26 M137 1263 h26" stroke="#ff8b00"/>
      </g>
      <g>
        <circle cx="210" cy="260" r="7" fill="#f70b28"/>
        <circle cx="880" cy="200" r="6" fill="#93db21"/>
        <circle cx="1010" cy="560" r="7" fill="#ffd500"/>
        <circle cx="70" cy="1150" r="6" fill="#3cc7f7"/>
        <circle cx="860" cy="1290" r="7" fill="#ac4dff"/>
      </g>
      <!-- dashed orbit behind the headline -->
      <ellipse cx="540" cy="330" rx="520" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="3 16" transform="rotate(-8 540 330)"/>
    </svg>
    <img class="peek" src="../../creative/kit/illustrations/code-2.svg" alt="" style="width:110px; top:64px; right:64px; transform: rotate(12deg)">
    <img class="peek" src="../../creative/kit/illustrations/atom-4.svg" alt="" style="width:110px; top:250px; left:56px; transform: rotate(-10deg); filter: brightness(0) invert(1); opacity: 0.25">

    <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
    <h1>STEM kits for<br><em>curious kids</em></h1>
    <div class="sticker">of all ages.</div>

    <div class="grid">
      <div class="tile" style="--bg: var(--cs-green); --tilt: -2deg"><img src="../../creative/kit/illustrations/robot-1.svg" alt=""><span>Robotics<br>&amp; Coding</span></div>
      <div class="tile" style="--bg: var(--cs-red); --ink: var(--cs-white); --tilt: 1.5deg"><img src="../../creative/kit/illustrations/lightbulb.svg" alt=""><span>Electronics<br>&amp; Circuits</span></div>
      <div class="tile" style="--bg: var(--cs-yellow); --tilt: -1.5deg"><img src="../../creative/kit/illustrations/nut-1.svg" alt=""><span>Building<br>&amp; Mechanics</span></div>
      <div class="tile" style="--bg: var(--cs-orange); --tilt: 1.5deg"><img src="../../creative/kit/illustrations/microscope.svg" alt=""><span>Earth<br>Sciences</span></div>
      <div class="tile" style="--bg: var(--cs-blue); --tilt: -1deg"><img src="../../creative/kit/illustrations/planet-1.svg" alt=""><span>Space<br>&amp; Astronomy</span></div>
      <div class="tile" style="--bg: var(--cs-purple); --ink: var(--cs-white); --tilt: 2deg"><img src="../../creative/kit/illustrations/beaker-1.svg" alt=""><span>Chemistry</span></div>
    </div>

    <p class="url">www.thecreatespace.co.za</p>
  </main>
</body>
</html>
