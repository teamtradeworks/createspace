<!DOCTYPE html>
<!--
  Instagram feed post (4:5): the categories cover, reflowed for the feed.
  Instagram's profile grid previews posts at 3:4, trimming ~34px from each
  side, so nothing sits near the left or right edge.
  Categories match storefront/src/config/categories.ts.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>CREATESPACE categories Instagram</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      color: var(--cs-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 56px;
      text-align: center;
    }
    .logo { width: 440px; height: auto; display: block; margin-bottom: 60px; }
    h1 {
      font-weight: 600;
      font-size: 88px;
      line-height: 1.04;
      letter-spacing: -0.015em;
      margin: 0 0 54px;
    }
    h1 em { font-style: normal; color: var(--cs-yellow); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      width: 100%;
    }
    .tile {
      background: var(--cs-white);
      color: var(--cs-navy);
      border-radius: 26px;
      height: 296px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-bottom: 12px solid var(--accent);
    }
    .tile img { height: 124px; width: auto; max-width: 240px; display: block; }
    .url {
      margin: 50px 0 0;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--cs-white);
      opacity: 0.85;
    }
    .tile span { font-size: 34px; font-weight: 600; line-height: 1.12; }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
    <h1>STEM kits for<br><em>curious kids</em><br><em>of all ages.</em></h1>
    <div class="grid">
      <div class="tile" style="--accent: var(--cs-blue)"><img src="../../creative/kit/illustrations/robot-1.svg" alt=""><span>Robotics<br>&amp; Coding</span></div>
      <div class="tile" style="--accent: var(--cs-yellow)"><img src="../../creative/kit/illustrations/lightbulb.svg" alt=""><span>Electronics<br>&amp; Circuits</span></div>
      <div class="tile" style="--accent: var(--cs-orange)"><img src="../../creative/kit/illustrations/nut-1.svg" alt=""><span>Building<br>&amp; Mechanics</span></div>
      <div class="tile" style="--accent: var(--cs-green)"><img src="../../creative/kit/illustrations/microscope.svg" alt=""><span>Earth<br>Sciences</span></div>
      <div class="tile" style="--accent: var(--cs-red)"><img src="../../creative/kit/illustrations/planet-1.svg" alt=""><span>Space<br>&amp; Astronomy</span></div>
      <div class="tile" style="--accent: var(--cs-purple)"><img src="../../creative/kit/illustrations/beaker-1.svg" alt=""><span>Chemistry</span></div>
    </div>
    <p class="url">www.thecreatespace.co.za</p>
  </main>
</body>
</html>
