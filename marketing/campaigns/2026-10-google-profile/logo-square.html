<!DOCTYPE html>
<!--
  Google Business Profile logo. Google shows it as a small circle next to the
  business name, so it carries only the red mark from the wordmark (the same
  one the website uses as its icon), sized to sit well inside the circle.
-->
<html lang="en-ZA" data-canvas="google-square">
<head>
  <meta charset="utf-8">
  <title>CREATESPACE profile logo</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark {
      height: 560px;
      width: auto;
      display: block;
      transform: translateY(-10px);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="mark" src="../../creative/kit/logo/mark-red.png" alt="CREATESPACE">
  </main>
</body>
</html>
