<!DOCTYPE html>
<!--
  Google Business Profile cover: the shop categories, portrait. Same design as
  instagram-categories.html, reflowed to two columns.
  The Search knowledge-panel tile shows about 0.62:1 from the centre, cutting
  ~90px top and bottom, so all content sits well inside that. The tile is
  shown at ~250px wide, so type and illustrations are set large.
  Categories match storefront/src/config/categories.ts.
-->
<html lang="en-ZA" data-canvas="google-business-portrait">
<head>
  <meta charset="utf-8">
  <title>CREATESPACE categories cover</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      position: relative;
      overflow: hidden;
      background: var(--cs-navy);
      color: var(--cs-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 64px;
      text-align: center;
    }
    .canvas > :not(.bg):not(.peek) { position: relative; }

    /* Background: sparkles, an orbit and two doodles peeking in */
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .peek { position: absolute; }

    .logo { width: 520px; height: auto; display: block; margin-bottom: 84px; }
    h1 {
      font-weight: 600;
      font-size: 112px;
      line-height: 1.02;
      letter-spacing: -0.015em;
      margin: 0;
    }
    h1 em { font-style: normal; color: var(--cs-yellow); }
    .sticker {
      display: inline-block;
      margin: 22px 0 76px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
      font-weight: 600;
      font-size: 76px;
      line-height: 1;
      padding: 20px 42px 26px;
      border-radius: 24px;
      transform: rotate(-3deg);
      box-shadow: 10px 10px 0 var(--cs-red);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px 28px;
      width: 100%;
    }
    .tile {
      background: var(--cs-white);
      color: var(--cs-navy);
      border-radius: 32px;
      height: 326px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border-bottom: 14px solid var(--accent);
    }
    .tile img { height: 150px; width: auto; max-width: 290px; display: block; }
    .tile span { font-size: 42px; font-weight: 600; line-height: 1.12; }
  </style>
</head>
<body>
  <main class="canvas">
    <svg class="bg" viewBox="0 0 1080 1920" aria-hidden="true">
      <g fill="none" stroke-linecap="round" stroke-width="7">
        <path d="M130 200 v38 M111 219 h38" stroke="#ffd500"/>
        <path d="M965 520 v32 M949 536 h32" stroke="#3cc7f7"/>
        <path d="M95 760 v28 M81 774 h28" stroke="#ac4dff"/>
        <path d="M990 1790 v34 M973 1807 h34" stroke="#93db21"/>
        <path d="M120 1800 v30 M105 1815 h30" stroke="#ff8b00"/>
      </g>
      <g>
        <circle cx="200" cy="250" r="8" fill="#f70b28"/>
        <circle cx="900" cy="300" r="7" fill="#93db21"/>
        <circle cx="1010" cy="800" r="8" fill="#ffd500"/>
        <circle cx="66" cy="1700" r="7" fill="#3cc7f7"/>
        <circle cx="560" cy="1830" r="7" fill="#ac4dff"/>
      </g>
      <!-- dashed orbit behind the headline -->
      <ellipse cx="540" cy="520" rx="540" ry="260" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5" stroke-dasharray="3 18" transform="rotate(-8 540 520)"/>
    </svg>
    <img class="peek" src="../../creative/kit/illustrations/code-2.svg" alt="" style="width:120px; top:104px; right:52px; transform: rotate(12deg)">
    <img class="peek" src="../../creative/kit/illustrations/atom-4.svg" alt="" style="width:130px; top:430px; left:48px; transform: rotate(-10deg); filter: brightness(0) invert(1); opacity: 0.25">

    <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
    <h1>STEM kits for<br><em>curious kids</em></h1>
    <div class="sticker">of all ages.</div>

    <div class="grid">
      <div class="tile" style="--accent: var(--cs-blue)"><img src="../../creative/kit/illustrations/robot-1.svg" alt=""><span>Robotics<br>&amp; Coding</span></div>
      <div class="tile" style="--accent: var(--cs-yellow)"><img src="../../creative/kit/illustrations/lightbulb.svg" alt=""><span>Electronics<br>&amp; Circuits</span></div>
      <div class="tile" style="--accent: var(--cs-orange)"><img src="../../creative/kit/illustrations/nut-1.svg" alt=""><span>Building<br>&amp; Mechanics</span></div>
      <div class="tile" style="--accent: var(--cs-green)"><img src="../../creative/kit/illustrations/microscope.svg" alt=""><span>Earth<br>Sciences</span></div>
      <div class="tile" style="--accent: var(--cs-red)"><img src="../../creative/kit/illustrations/planet-1.svg" alt=""><span>Space<br>&amp; Astronomy</span></div>
      <div class="tile" style="--accent: var(--cs-purple)"><img src="../../creative/kit/illustrations/beaker-1.svg" alt=""><span>Chemistry</span></div>
    </div>
  </main>
</body>
</html>
