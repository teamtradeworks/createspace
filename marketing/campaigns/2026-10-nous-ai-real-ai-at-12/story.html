<!DOCTYPE html>
<!--
  Ad brief A5: "Real AI at 12." Meta story (1080 x 1920).
  Age and skill series (A1-A6). The layout lives in age-series.css and stays
  identical across the series; this ad sets the purple accent, its copy and
  the Nous AI robot. Purple text on navy is too dark to read at label size,
  so the label and pill text use a lighter purple; pill outlines keep #AC4DFF.
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>Real AI at 12</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="age-series.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --accent: var(--cs-purple);
    }

    .series,
    .pills li {
      color: #c89bff;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
      <p class="series">Ages 12-16</p>
    </div>

    <h1>
      <span>Real AI at <span class="age">12</span>.</span>
    </h1>

    <p class="body">Not a chatbot. A robot they build, then work through real AI projects with, from block code up to Python.</p>

    <ul class="pills">
      <li>Ages 12-16</li>
      <li>7+ AI projects</li>
      <li>EdTech Awards 2025 Winner</li>
    </ul>

    <div class="card">
      <img src="images/nous-ai-robot-white.jpg" alt="MatataStudio Nous AI robot with its camera module, screen and wheels">
    </div>

    <div class="footer">
      <div>
        <p class="product">MatataStudio Nous AI Set</p>
        <p class="price"><b>R 4,580</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop now</span>
    </div>
  </main>
</body>
</html>
