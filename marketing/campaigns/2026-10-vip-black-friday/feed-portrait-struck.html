<!DOCTYPE html>
<!--
  VIP Black Friday sign-up, Meta feed portrait (1080 x 1350).
  Built on the layout of the best performer in the test campaign,
  2026-10-makerzoid-72-robots: a struck-through "old way" line, a 112px
  headline with one yellow-marked number, the same product photo on a pale
  blue card bleeding off the right edge, and a red CTA pill. A red VIP stamp
  on the card carries the date. Styles live in struck.css, shared with the
  square and story versions.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Shop Black Friday 4 days early</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="struck.css">
</head>
<body>
  <main class="canvas">
    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">

    <p class="struck">Wait for Black Friday like everyone else.</p>

    <h1>
      <span>Shop Black Friday</span>
      <span><span class="marker">4</span> days early.</span>
    </h1>

    <p class="who">Only for people on our <b>email list</b>.</p>

    <div class="card">
      <img src="images/makerzoid-smart-robot-box-and-builds.jpg" alt="Makerzoid Smart Robot box with a built robot drummer and eleven other robot builds around it">
      <div class="stamp">
        <small>VIP from</small>
        <b>19</b>
        <small>Nov</small>
      </div>
    </div>

    <div class="footer">
      <div>
        <p class="product">VIP early access, 19 to 22 Nov</p>
        <p class="price">thecreatespace.co.za</p>
      </div>
      <span class="cta">Sign up free</span>
    </div>
  </main>
</body>
</html>
