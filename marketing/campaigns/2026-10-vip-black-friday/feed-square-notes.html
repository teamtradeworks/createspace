<!DOCTYPE html>
<!--
  Meta square feed ad, second concept: a parent's notes-app Black Friday plan.
  Same generic notes look as 2026-10-notes-checklist (cream paper, DM Sans,
  mustard tint, no app branding), so it reads as the parent's own phone.
  The open last item is the ask. Only the stuck-on photo, the red VIP sticker
  and the wordmark are ours.
  Render: marketing/scripts/render.sh marketing/campaigns/2026-10-vip-black-friday/feed-square-notes.html
-->
<html lang="en-ZA" data-canvas="meta-square">
<head>
  <meta charset="utf-8">
  <title>VIP Black Friday notes</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("../../creative/kit/fonts/DMSans.ttf") format("truetype");
      font-weight: 100 1000;
      font-display: block;
    }

    :root {
      --paper: #fffdf3;
      --ink: #1b1a17;
      --ink-soft: #8a8679;
      --done: #8f8b7e;
      --rule: #efe9d6;
      --mustard: #d6a21c;
      --mustard-ink: #a77a06;
      --ui: "DM Sans", sans-serif;
    }

    body { background: var(--paper); }

    .canvas {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui);
      font-optical-sizing: auto;
    }

    .back {
      position: absolute;
      top: 52px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 32px;
      font-weight: 500;
      color: var(--mustard-ink);
    }

    .note {
      position: absolute;
      top: 128px;
      left: 72px;
      right: 72px;
    }

    .note h1 {
      margin: 0;
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .edited {
      margin: 12px 0 0;
      font-size: 26px;
      color: var(--ink-soft);
    }

    .list {
      list-style: none;
      padding: 0;
      margin: 22px 0 0;
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 26px;
      min-height: 84px;
      border-bottom: 2px solid var(--rule);
      font-size: 40px;
      letter-spacing: -0.01em;
    }

    .list li:last-child { border-bottom: 0; }

    .tick {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--mustard);
      color: #fff;
    }

    .done span {
      color: var(--done);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(143, 139, 126, 0.8);
    }

    /* The open item wraps to two lines, with the tick pinned to the first. */
    .todo {
      align-items: flex-start !important;
      padding-top: 18px;
    }
    .todo .tick {
      margin-top: 2px;
      background: transparent;
      box-shadow: inset 0 0 0 3px var(--mustard);
    }
    .todo span {
      max-width: 470px;
      color: var(--ink);
      font-weight: 500;
      line-height: 1.22;
    }

    .caret {
      display: inline-block;
      width: 3px;
      height: 46px;
      margin-left: 4px;
      vertical-align: -9px;
      border-radius: 2px;
      background: var(--mustard);
    }

    /* A photo, printed and stuck onto the note. */
    .photo {
      position: absolute;
      right: 64px;
      bottom: 60px;
      width: 392px;
      margin: 0;
      padding: 16px 16px 20px;
      background: #fff;
      border-radius: 6px;
      transform: rotate(3.5deg);
      box-shadow:
        0 1px 2px rgba(60, 48, 20, 0.10),
        0 18px 36px -12px rgba(60, 48, 20, 0.30);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 262px;
      object-fit: cover;
      object-position: 50% 62%;
    }

    .photo figcaption {
      margin-top: 12px;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-align: center;
      color: var(--ink);
    }

    .tape {
      position: absolute;
      top: -20px;
      left: 50%;
      width: 140px;
      height: 42px;
      margin-left: -70px;
      background: rgba(242, 214, 130, 0.62);
      transform: rotate(-4deg);
      box-shadow: 0 1px 2px rgba(60, 48, 20, 0.08);
    }

    /* Red sticker on the photo corner: the one urgency mark (Red Means Saving). */
    .sticker {
      position: absolute;
      top: -58px;
      right: -40px;
      width: 156px;
      height: 156px;
      border-radius: 50%;
      background: var(--cs-red);
      color: var(--cs-white);
      font-family: var(--cs-font, "Outfit", sans-serif);
      display: grid;
      place-content: center;
      text-align: center;
      transform: rotate(-14deg);
      box-shadow: 0 8px 18px rgba(60, 20, 20, 0.28);
    }
    .sticker::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
    }
    .sticker b { font-weight: 800; font-size: 52px; line-height: 0.9; letter-spacing: 0.03em; }
    .sticker i {
      font-style: normal;
      font-weight: 700;
      font-size: 17px;
      line-height: 1.2;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .wordmark {
      position: absolute;
      left: 72px;
      bottom: 72px;
      width: 236px;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="back">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Notes
    </div>

    <article class="note">
      <h1>Black Friday plan</h1>
      <p class="edited">Edited today</p>

      <ul class="list">
        <li class="done"><i class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>write the gift list</span></li>
        <li class="done"><i class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>nothing with another screen</span></li>
        <li class="done"><i class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>hide the list from the kids</span></li>
        <li class="todo"><i class="tick"></i><span>get on the CREATESPACE list so we shop first<i class="caret"></i></span></li>
      </ul>
    </article>

    <figure class="photo">
      <i class="tape" aria-hidden="true"></i>
      <img src="images/dad-and-kids-launching-rockets.jpg" alt="Dad and two boys cheering as an air rocket launches">
      <figcaption>Subscribers shop Black Friday before everyone else</figcaption>
      <div class="sticker"><b>VIP</b><i>Early<br>access</i></div>
    </figure>

    <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
  </main>
</body>
</html>
