<!DOCTYPE html>
<!--
  Instagram and Facebook Story (9:16): VIP early access to Black Friday for email subscribers.
  Calendar concept: two weeks of November, with 19 to 22 Nov blocked out for
  subscribers and 23 Nov onwards for everyone else, so the 4-day head start reads at a glance.
  Render: marketing/scripts/render.sh marketing/campaigns/2026-10-vip-black-friday/story-calendar.html
  Adapted from feed-portrait-calendar.html. Content runs from about 200px to 1720px, a little into Meta's 270px safe zones, by choice (owner, 2026-11-02).
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>VIP Black Friday sign up: calendar</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      color: var(--cs-white);
      isolation: isolate;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
    }
    .glow--blue   { width: 720px; height: 560px; left: 360px; top: 700px; background: rgba(60, 199, 247, 0.22); }
    .glow--purple { width: 600px; height: 520px; left: -100px; top: 1080px; background: rgba(172, 77, 255, 0.2); }

    /* Faint whitened illustrations in the safe zones, where Instagram's UI sits */
    .piece { position: absolute; display: block; height: auto; filter: brightness(0) invert(1); opacity: 0.09; }
    .atom   { width: 260px; right: -50px; top: -60px; transform: rotate(16deg); }
    .planet { width: 280px; left: -60px; bottom: -70px; transform: rotate(-14deg); }

    .logo {
      position: absolute;
      left: 72px;
      top: 200px;
      height: 54px;
      width: auto;
    }

    /* Product photo, pinned onto the calendar like a print */
    .photo {
      position: absolute;
      left: 548px;
      top: 596px;
      width: 456px;
      height: 368px;
      margin: 0;
      border-radius: 18px;
      background: var(--cs-white);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      outline: 6px solid var(--cs-white);
      transform: rotate(4deg);
      z-index: 2;
    }
    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
      object-position: 50% 100%;
    }
    .photo .crop {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
    }

    .headline {
      position: absolute;
      left: 72px;
      top: 300px;
      margin: 0;
      font-weight: 600;
      font-size: 110px;
      line-height: 1.02;
      letter-spacing: -0.03em;
    }
    .headline em { font-style: normal; color: var(--cs-orange); }

    .sub {
      position: absolute;
      left: 72px;
      top: 586px;
      width: 470px;
      margin: 0;
      font-size: 46px;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.78);
      text-wrap: balance;
    }

    /* Calendar */
    .cal {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 1040px;
    }
    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      column-gap: 8px;
      height: 212px;
    }
    .week + .week { margin-top: 18px; }

    .day {
      grid-row: 1;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 24px;
    }
    .day small {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.62;
    }
    .day b {
      font-size: 74px;
      font-weight: 600;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .week--before .day { color: rgba(255, 255, 255, 0.55); }

    .band {
      grid-row: 1;
      position: relative;
      border-radius: 20px;
      padding: 18px 22px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .band--vip {
      grid-column: 4 / 8;
      background: var(--cs-blue);
      color: var(--cs-navy);
      box-shadow: 0 18px 40px rgba(4, 8, 30, 0.35);
    }
    .band--vip ~ .day.vip { color: var(--cs-navy); }
    .band--vip ~ .day.vip small { opacity: 0.7; }
    .band--rest {
      grid-column: 1 / 8;
      border: 2px dashed rgba(255, 255, 255, 0.28);
      color: rgba(255, 255, 255, 0.6);
    }
    .week--rest .day { color: rgba(255, 255, 255, 0.72); }

    /* Red early-access stamp on the photo's corner */
    .stamp {
      position: absolute;
      right: -30px;
      top: -104px;
      width: 206px;
      height: 206px;
      border-radius: 50%;
      background: var(--cs-red);
      color: var(--cs-white);
      display: grid;
      place-content: center;
      text-align: center;
      transform: rotate(6deg);
      z-index: 3;
      box-shadow: 0 10px 24px rgba(4, 8, 30, 0.45);
    }
    .stamp::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
    }
    .stamp b { font-weight: 800; font-size: 70px; line-height: 0.9; letter-spacing: 0.03em; }
    .stamp i {
      font-style: normal;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: 0.06em;
      margin-top: 6px;
    }

    .foot {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cta {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 124px;
      padding: 0 64px;
      border-radius: 12px;
      background: var(--cs-orange);
      color: var(--cs-navy);
      font-weight: 600;
      font-size: 48px;
    }
    .cta svg { width: 46px; height: 46px; }
  </style>
</head>
<body>
<main class="canvas">
  <div class="glow glow--blue"></div>
  <div class="glow glow--purple"></div>

  <img class="piece atom" src="images/atom-2-outline.svg" alt="">
  <img class="piece planet" src="images/planet-1-outline.svg" alt="">

  <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">

  <h1 class="headline">Shop Black Friday<br><em>4 days early.</em></h1>
  <p class="sub">Join our email list and the sale opens to you on 19&nbsp;November.</p>

  <figure class="photo">
    <span class="crop"><img src="images/kid-shocked-with-volcano.jpg" alt="A boy with his hands on his head, amazed by the volcano he built"></span>
    <span class="stamp"><b>VIP</b><i>EARLY<br>ACCESS</i></span>
  </figure>

  <section class="cal" aria-label="November 2026">
    <div class="week week--before">
      <span class="band band--vip">Subscribers</span>
      <span class="day" style="grid-column:1"><small>Mon</small><b>16</b></span>
      <span class="day" style="grid-column:2"><small>Tue</small><b>17</b></span>
      <span class="day" style="grid-column:3"><small>Wed</small><b>18</b></span>
      <span class="day vip" style="grid-column:4"><small>Thu</small><b>19</b></span>
      <span class="day vip" style="grid-column:5"><small>Fri</small><b>20</b></span>
      <span class="day vip" style="grid-column:6"><small>Sat</small><b>21</b></span>
      <span class="day vip" style="grid-column:7"><small>Sun</small><b>22</b></span>
    </div>

    <div class="week week--rest">
      <span class="band band--rest">Everyone else</span>
      <span class="day" style="grid-column:1"><small>Mon</small><b>23</b></span>
      <span class="day" style="grid-column:2"><small>Tue</small><b>24</b></span>
      <span class="day" style="grid-column:3"><small>Wed</small><b>25</b></span>
      <span class="day" style="grid-column:4"><small>Thu</small><b>26</b></span>
      <span class="day" style="grid-column:5"><small>Fri</small><b>27</b></span>
      <span class="day" style="grid-column:6"><small>Sat</small><b>28</b></span>
      <span class="day" style="grid-column:7"><small>Sun</small><b>29</b></span>
    </div>
  </section>

  <footer class="foot">
    <span class="cta">Get on the list <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </footer>
</main>
</body>
</html>
