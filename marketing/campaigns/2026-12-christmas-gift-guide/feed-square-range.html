<!DOCTYPE html>
<!--
  Christmas range option, square (1080 x 1080). Adapted from
  feed-portrait-range.html: two-line headline and smaller cards so all four
  kits still fit.
  Facts: brief.md.
-->
<html lang="en-ZA" data-canvas="meta-square">
<head>
  <meta charset="utf-8">
  <title>Gifts they'll still be playing with in January</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="single-kit.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="range.css">
  <style>
    .canvas { padding: 56px 60px; }
    .gift-pill { font-size: 26px; padding: 14px 28px 15px; }
    h1 { margin-top: 30px; font-size: 64px; line-height: 1.02; }
    .grid { margin-top: 30px; gap: 16px; }
    .item { padding: 14px 20px 16px; border-radius: 20px; }
    .name { font-size: 27px; }
    .item .age-pill { font-size: 23px; padding: 6px 14px 7px; }
    .meta { margin-top: 8px; }
    .footer { margin-top: 28px; }
    .note { font-size: 30px; }
    .cta { height: 80px; font-size: 32px; padding: 0 38px 2px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="topbar">
      <span class="gift-pill">Christmas gift ideas</span>
    </div>

    <h1>
      <span>Gifts they'll still be playing</span>
      <span>with in <span class="marker">January.</span></span>
    </h1>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="spark" viewBox="0 0 80 80"><path d="M40 0 C44 30 50 36 80 40 C50 44 44 50 40 80 C36 50 30 44 0 40 C30 36 36 30 40 0Z"/></symbol>
    </svg>
    <svg class="spark y" style="left:290px;top:40px;width:38px;height:38px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark b" style="left:250px;top:88px;width:22px;height:22px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark o" style="left:784px;top:44px;width:24px;height:24px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark y" style="left:820px;top:82px;width:32px;height:32px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark b" style="left:640px;top:214px;width:30px;height:30px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark y" style="left:880px;top:196px;width:50px;height:50px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark o" style="left:990px;top:250px;width:22px;height:22px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark b" style="left:770px;top:262px;width:20px;height:20px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark y" style="left:440px;top:960px;width:34px;height:34px" aria-hidden="true"><use href="#spark"/></svg>
    <svg class="spark o" style="left:494px;top:1004px;width:20px;height:20px" aria-hidden="true"><use href="#spark"/></svg>

    <div class="grid">
      <div class="item">
        <div class="photo"><img src="images/robot-master-premium-case.png" alt="Makerzoid Robot Master Premium storage case"></div>
        <div class="meta"><p class="name">Makerzoid Robot<br>Master Premium</p><span class="age-pill">6 to 14</span></div>
      </div>
      <div class="item">
        <div class="photo"><img src="images/vincibot-remote-and-box-white.jpg" alt="MatataStudio VinciBot with its box and remote"></div>
        <div class="meta"><p class="name">MatataStudio<br>VinciBot</p><span class="age-pill">8 to 12</span></div>
      </div>
      <div class="item">
        <div class="photo"><img src="images/nasa-lunar-telescope-white.jpg" alt="NASA Lunar Telescope on its tripod"></div>
        <div class="meta"><p class="name">NASA Lunar<br>Telescope</p><span class="age-pill">8+</span></div>
      </div>
      <div class="item">
        <div class="photo"><img src="images/makerzoid-smart-robot-box-and-builds.jpg" alt="Makerzoid Smart Robot box with twelve builds"></div>
        <div class="meta"><p class="name">Makerzoid<br>Smart Robot</p><span class="age-pill">6+</span></div>
      </div>
    </div>

    <div class="footer">
      <p class="note"><b>Free delivery</b><br>on orders over R 1,500</p>
      <span class="cta">Shop STEM gifts</span>
    </div>
  </main>
</body>
</html>
