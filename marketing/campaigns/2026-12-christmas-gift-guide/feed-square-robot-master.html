<!DOCTYPE html>
<!--
  Christmas single-kit option, square (1080 x 1080). Adapted from
  feed-portrait-robot-master.html with a tighter type scale so the product
  card keeps enough height. Facts and sources: brief.md.
-->
<html lang="en-ZA" data-canvas="meta-square">
<head>
  <meta charset="utf-8">
  <title>200+ builds. One gift. All holiday long.</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="single-kit.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root { --margin: 64px; }
    .wordmark { height: 42px; }
    .gift-pill { font-size: 22px; padding: 14px 24px 15px 20px; }
    .gift-pill svg { width: 26px; height: 26px; }
    h1 { margin-top: 40px; font-size: 84px; }
    .body { max-width: 900px; margin-top: 22px; font-size: 28px; }
    .card { margin-top: 30px; }
    .card .build { top: 10%; height: 80%; }
    .card .case { height: 66%; bottom: 20px; }
    .footer { margin-top: 30px; }
    .product { font-size: 32px; }
    .price { margin-top: 8px; }
    .age-pill { font-size: 22px; }
    .cta { height: 88px; font-size: 34px; }
    .sparkles { top: 196px; right: 72px; width: 150px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="topbar">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
      <span class="gift-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.4 7 .9-5.1 4.8 1.3 6.9L12 17.4l-6.2 3.4 1.3-6.9L2 9.1l7-.9z"/></svg>Christmas gift idea</span>
    </div>

    <h1>
      <span><span class="marker">200+</span> builds.</span>
      <span>One gift.</span>
      <span>All holiday long.</span>
    </h1>

    <p class="body">Build a robot, code it with the app, take it apart and build the next. 600+ pieces to keep them busy long after Christmas Day.</p>

    <svg class="sparkles" viewBox="0 0 200 160" aria-hidden="true">
      <path class="s1" d="M120 10 C124 40 130 46 160 50 C130 54 124 60 120 90 C116 60 110 54 80 50 C110 46 116 40 120 10Z"/>
      <path class="s2" d="M50 80 C52 96 56 100 72 102 C56 104 52 108 50 124 C48 108 44 104 28 102 C44 100 48 96 50 80Z"/>
      <path class="s3" d="M170 110 C171 120 174 123 184 124 C174 125 171 128 170 138 C169 128 166 125 156 124 C166 123 169 120 170 110Z"/>
    </svg>

    <div class="card">
      <img class="build" src="images/robot-master-dinosaur-build.png" alt="A walking dinosaur robot built from the Makerzoid Robot Master Premium kit">
      <img class="case" src="images/robot-master-premium-case.png" alt="Makerzoid Robot Master Premium storage case">
    </div>

    <div class="footer">
      <div>
        <p class="product">Makerzoid Robot Master Premium</p>
        <p class="price"><span class="age-pill">Ages 6 to 14</span></p>
      </div>
      <span class="cta">Shop now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </main>
</body>
</html>
