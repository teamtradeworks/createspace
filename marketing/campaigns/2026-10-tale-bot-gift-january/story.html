<!DOCTYPE html>
<!--
  Ad brief G1: "A gift they'll still be using in January." Meta story (1080 x 1920).
  Gifting. A kraft gift tag, written by Gran, sits over the Tale-Bot Pro on a
  white card that bleeds off the right edge.
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>A gift they'll still be using in January</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="gift-tag.css">
  <script src="../../creative/kit/canvas.js"></script>
</head>
<body>
  <main class="canvas">
    <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">

    <h1>A gift they'll still be using in <em>January.</em></h1>

    <div class="card">
      <img src="images/talebot-pro-pens-white.jpg" alt="MatataStudio Tale-Bot Pro robot with two felt-tip pens clipped to its sides">
    </div>

    <div class="tag">
      <div class="paper"></div>
      <div class="ring"></div>
      <svg class="twine" viewBox="0 0 120 170" aria-hidden="true">
        <path d="M60 152 C 40 120, 18 70, 34 30 C 44 6, 76 6, 86 30 C 100 66, 82 118, 60 152" fill="none" stroke="#b89a6c" stroke-width="7" stroke-linecap="round" transform="translate(1.5 2)"/>
        <path d="M60 152 C 40 120, 18 70, 34 30 C 44 6, 76 6, 86 30 C 100 66, 82 118, 60 152" fill="none" stroke="var(--twine)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 5"/>
        <path d="M60 152 C 40 120, 18 70, 34 30 C 44 6, 76 6, 86 30 C 100 66, 82 118, 60 152" fill="none" stroke="var(--twine)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
      </svg>
      <ul class="note">
        <li>To: Zoe (5)</li>
        <li>From: Gran</li>
        <li>Contains: one little robot she codes with buttons</li>
        <li>Screens: <span class="zero">0<svg viewBox="0 0 60 60" preserveAspectRatio="none" aria-hidden="true"><path d="M44 8 C 22 0, 4 14, 5 32 C 6 52, 34 58, 50 46 C 62 36, 58 12, 36 6" fill="none" stroke="var(--marker)" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></li>
      </ul>
    </div>

    <div class="footer">
      <div>
        <p class="product">MatataStudio Tale-Bot Pro, ages 3-6</p>
        <p class="price"><b>R 2,280</b> | delivered in 1-3 days</p>
      </div>
      <span class="cta">Shop gifts</span>
    </div>
  </main>
</body>
</html>
