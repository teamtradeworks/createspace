<!DOCTYPE html>
<!--
  Ad brief A2: "Builds problem solving at 8." Meta feed portrait (1080 x 1350).
  Age and skill series (A1-A6). The layout lives in age-series.css and stays
  identical across the series; this ad sets the orange accent, its copy and
  the VinciBot photo.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Problem solving at 8</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="age-series.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --accent: var(--cs-orange);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
      <p class="series">Ages 8-12</p>
    </div>

    <h1>
      <span>Builds problem</span>
      <span>solving at <span class="age">8</span>.</span>
    </h1>

    <p class="body">Plan the route, test it, find the bug, try again. Starts with a remote, grows into Scratch and Python.</p>

    <ul class="pills">
      <li>Ages 8-12</li>
      <li>75 activity cards</li>
      <li>18 challenges</li>
    </ul>

    <div class="card">
      <img src="images/vincibot-remote-and-box-white.jpg" alt="MatataStudio VinciBot robot beside its box, with a hand holding the IR remote control">
    </div>

    <div class="footer">
      <div>
        <p class="product">MatataStudio VinciBot</p>
        <p class="price"><b>R 2,580</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop now</span>
    </div>
  </main>
</body>
</html>
