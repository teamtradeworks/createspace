<!DOCTYPE html>
<!--
  Black Friday organic Instagram post. Feed portrait (1080 x 1350).
  Built to stand out on @thecreatespace.za, where the last dozen tiles are
  almost all navy. The owner asked to move off the blue ground for this one,
  so the canvas grounds on Spark Yellow: a one-off exception to the
  Navy-or-White Ground Rule, recorded in brief.md. Navy type, red only for the
  saving (sticker), orange CTA kept on a navy footer so Orange Means Go holds.
  Facts: brief.md (up to 20% off, 35 kits, 23 to 30 Nov).
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Black Friday, up to 20% off</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="instagram-yellow.css">
</head>
<body>
  <main class="canvas">
    <div class="burst" aria-hidden="true"></div>

    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
      <h1><span>Black</span><span>Friday</span></h1>
      <p class="kicker">35 STEM kits they'll be building long after Christmas.</p>
    </div>

    <div class="sticker">
      <span class="upto">Up to</span>
      <span class="num">20%</span>
      <span class="off">off</span>
    </div>

    <div class="stage">
      <img class="deco atom" src="../../creative/kit/illustrations/atom-2.svg" alt="">
      <img class="deco nut" src="../../creative/kit/illustrations/nut-1.svg" alt="">
      <img class="case" src="images/robot-master-premium-case.png" alt="Makerzoid Robot Master Premium case">
      <img class="build" src="images/robot-master-dinosaur-build.png" alt="A walking dinosaur robot built from the Robot Master kit">
    </div>

    <div class="footer">
      <p><b>23 to 30 November</b>Free delivery over R 1,500</p>
      <span class="cta">Link in bio</span>
    </div>
  </main>
</body>
</html>
