<!DOCTYPE html>
<!--
  Black Friday organic Instagram story (1080 x 1920). Story version of
  feed-portrait-instagram-yellow.html, sharing instagram-yellow.css.
  Keeps the top and bottom 270px clear of copy (profile bar, reply bar).
  The bottom navy area is left empty for the Instagram link sticker, which
  the "Shop the sale" chip points down to. Facts: brief.md.
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>Black Friday, up to 20% off (story)</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="instagram-yellow.css">
  <style>
    .burst { top: 56%; width: 2800px; height: 2800px; }

    /* Top 270px stays free of copy (profile bar), so brand illustrations
       fill it instead, partly cropped by the top edge. */
    .sky { position: absolute; inset: 0 0 auto 0; height: 270px; z-index: 1; }
    .sky img { position: absolute; display: block; }
    .sky .planet { width: 200px; left: 40px; top: 80px; transform: rotate(-14deg); }
    .sky .code { width: 96px; left: 380px; top: 150px; transform: rotate(8deg); }
    .sky .chip { width: 70px; left: 650px; top: 80px; transform: rotate(16deg); }
    .sky .beaker { width: 82px; right: 90px; top: 140px; transform: rotate(-10deg); }

    .top { padding-top: 290px; }
    .wordmark { height: 56px; }
    h1 { margin-top: 44px; font-size: 200px; }
    .kicker { margin-top: 44px; font-size: 48px; max-width: 660px; }

    .sticker {
      top: 440px;
      right: 34px;
      width: 290px;
      height: 290px;
    }
    .sticker .upto { font-size: 30px; }
    .sticker .num { font-size: 130px; }
    .sticker .off { font-size: 48px; }

    .stage .build { width: 880px; left: 10px; bottom: 50px; }
    .stage .case { width: 430px; right: 44px; bottom: 60px; }
    .stage .atom { left: 90px; top: 50px; width: 120px; }
    .stage .nut { left: 560px; top: 70px; width: 96px; }

    /* Copy ends above the bottom 270px; the navy below it is kept short. */
    .footer { padding: 52px var(--margin) 220px; }
    .footer p { font-size: 34px; }
    .footer p b { font-size: 44px; }
    .cta svg { width: 34px; height: 34px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="burst" aria-hidden="true"></div>

    <div class="sky" aria-hidden="true">
      <img class="planet" src="../../creative/kit/illustrations/planet-1.svg" alt="">
      <img class="code" src="../../creative/kit/illustrations/code-2.svg" alt="">
      <img class="chip" src="../../creative/kit/illustrations/chip-2.svg" alt="">
      <img class="beaker" src="../../creative/kit/illustrations/beaker-1.svg" alt="">
    </div>

    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
      <h1><span>Black</span><span>Friday</span></h1>
      <p class="kicker">35 STEM kits they'll be building long after Christmas.</p>
    </div>

    <div class="sticker">
      <span class="upto">Up to</span>
      <span class="num">20%</span>
      <span class="off">off</span>
    </div>

    <div class="stage">
      <img class="deco atom" src="../../creative/kit/illustrations/atom-2.svg" alt="">
      <img class="deco nut" src="../../creative/kit/illustrations/nut-1.svg" alt="">
      <img class="build" src="images/robot-master-dinosaur-build.png" alt="A walking dinosaur robot built from the Robot Master kit">
      <img class="case" src="images/robot-master-premium-case.png" alt="Makerzoid Robot Master Premium case">
    </div>

    <div class="footer">
      <p><b>23 to 30 November</b>Free delivery over R 1,500</p>
      <span class="cta">Shop the sale <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
    </div>
  </main>
</body>
</html>
