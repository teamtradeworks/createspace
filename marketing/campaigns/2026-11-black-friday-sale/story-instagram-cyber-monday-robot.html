<!DOCTYPE html>
<!--
  Cyber Monday organic Instagram story, robot version (1080 x 1920). Story
  version of feed-portrait-instagram-cyber-monday-robot.html: navy ground, no
  logo, yellow eyebrow, white "CYBER MONDAY", yellow "Up to 20% off" tag, red
  "Ends tonight" pill, and the blue brand robot on a dashed orbit, here
  centred below the copy.
  Keeps the top and bottom 270px clear of copy (profile bar, reply bar). The
  bottom 270px is left empty for the Instagram link sticker. No CTA button on
  the image (owner's call, 2026-11-27): the link sticker is the action.
  Facts: brief.md.
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>Cyber Monday, last day of the sale (robot story)</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="sale.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      position: relative;
      padding: 0;
      background: var(--cs-navy);
      color: var(--cs-white);
    }

    .top {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      padding: 280px 72px 0;
    }

    .eyebrow {
      margin: 0;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cs-yellow);
    }

    h1 {
      margin: 26px 0 0;
      font-size: 184px;
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .tag {
      align-self: flex-start;
      margin-top: 40px;
      padding: 18px 38px 24px;
      border-radius: 18px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
      font-size: 88px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      transform: rotate(-2deg);
    }

    .sale-pill {
      align-self: flex-start;
      margin-top: 40px;
      font-size: 32px;
      padding: 20px 34px 21px;
    }

    /* Everything sits higher than a plain story so the owner can add a CTA
       (or the link sticker) in the space under the footer. */
    .orbit-group {
      position: absolute;
      inset: 0;
      transform: translateY(-90px) scale(0.88);
      transform-origin: 560px 1245px;
    }

    /* Orbit, icons and robot, centred on (560, 1245) before the shift. */
    .orbit {
      position: absolute;
      left: 210px;
      top: 1005px;
      width: 700px;
      height: 480px;
      border: 3px dashed rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      transform: rotate(-10deg);
    }

    .robot {
      position: absolute;
      left: 385px;
      top: 1050px;
      width: 350px;
      height: auto;
      transform: rotate(-6deg);
      filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.45));
    }

    .el {
      position: absolute;
      height: auto;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.35));
    }
    .el.code   { width: 130px; left: 150px; top: 1110px; transform: rotate(-14deg); }
    .el.bulb   { width: 104px; left: 860px; top: 960px;  transform: rotate(14deg); }
    .el.nut    { width: 96px;  left: 880px; top: 1260px; transform: rotate(18deg); }
    .el.planet { width: 170px; left: 560px; top: 1405px; transform: rotate(-8deg); }
    .el.chip   { width: 86px;  left: 230px; top: 1330px; transform: rotate(-16deg); }

    /* Copy ends at 1520, leaving room for the owner's CTA below it and
       the bottom 270px clear for the reply bar. */
    .footer {
      position: absolute;
      z-index: 2;
      left: 72px;
      right: 72px;
      bottom: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 36px;
      border-top: 2px solid rgba(255, 255, 255, 0.16);
    }
    .footer p { margin: 0; font-size: 32px; line-height: 1.3; color: rgba(255,255,255,0.75); }
    .footer p b { display: block; color: var(--cs-white); font-weight: 600; font-size: 42px; }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 100px;
      padding: 0 38px;
      border-radius: 12px;
      background: var(--cs-orange);
      color: var(--cs-navy);
      font-size: 38px;
      font-weight: 600;
      white-space: nowrap;
    }
    .cta svg { width: 34px; height: 34px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="orbit-group">
    <div class="orbit" aria-hidden="true"></div>
    <img class="el code" src="../../creative/kit/illustrations/code-1.svg" alt="">
    <img class="el bulb" src="../../creative/kit/illustrations/lightbulb.svg" alt="">
    <img class="el nut" src="../../creative/kit/illustrations/nut-2.svg" alt="">
    <img class="el planet" src="../../creative/kit/illustrations/planet-1.svg" alt="">
    <img class="el chip" src="../../creative/kit/illustrations/chip-2.svg" alt="">
    <img class="robot" src="../../creative/kit/illustrations/robot-2.svg" alt="">
    </div>

    <div class="top">
      <p class="eyebrow">Last day of the sale</p>
      <h1>Cyber<br>Monday</h1>
      <span class="tag">Up to 20% off</span>
      <span class="sale-pill">Ends tonight</span>
    </div>

    <div class="footer">
      <p><b>Monday 30 November</b>Free delivery over R 1,500</p>
    </div>
  </main>
</body>
</html>
