<!DOCTYPE html>
<!--
  Cyber Monday organic Instagram post: the last day of the Black Friday sale.
  Feed portrait (1080 x 1350). Follows the yellow Black Friday post
  (feed-portrait-instagram-yellow.html) so the two read as a pair on the
  @thecreatespace.za grid, and shares instagram-yellow.css. Spark Yellow ground
  is the same one-off exception recorded in brief.md.
  Differences from the Black Friday post: "Cyber Monday" headline with a navy
  "Last day" tag, three sale best sellers in place of one (Robot Master
  dinosaur build, Superbot car, VinciBot), and "Ends tonight" in the footer.
  Red stays on the saving sticker only; orange CTA stays on the navy footer.
  Facts: brief.md (up to 20% off, 35 kits, ends 30 Nov, free delivery over
  R 1,500). "Tonight" relies on prices staying live until 23:59 on 30 Nov
  (see cyber-monday-email-shopify-messaging.md).
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Cyber Monday, last day of the sale</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="instagram-yellow.css">
  <style>
    h1 { font-size: 150px; margin-top: 36px; }

    /* Navy "Last day" tag, tilted against the sticker. */
    .lastday {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 30px 18px;
      border-radius: 14px;
      background: var(--cs-navy);
      color: var(--cs-yellow);
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      transform: rotate(-3deg);
      transform-origin: left center;
    }

    .kicker { margin-top: 28px; max-width: 600px; font-size: 38px; }

    .sticker { top: 400px; right: 50px; width: 300px; height: 300px; }
    .sticker .num { font-size: 136px; }

    /* Three products: VinciBot at the back right, dinosaur in front on the
       left, Superbot car in front on the right. */
    .stage .vinci {
      width: 350px;
      left: auto;
      right: 300px;
      bottom: 330px;
      transform: rotate(-4deg);
      filter: drop-shadow(0 20px 22px rgba(12,20,70,0.25));
    }
    .stage .build {
      width: 600px;
      left: 30px;
      bottom: 34px;
    }
    .stage .car {
      width: 400px;
      left: auto;
      right: 40px;
      bottom: 46px;
      transform: rotate(3deg);
      filter: drop-shadow(0 24px 22px rgba(12,20,70,0.32));
    }
    .stage .atom { left: 70px; top: 40px; width: 104px; }
    .stage .nut  { display: none; }

    .footer p b { font-size: 40px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="burst" aria-hidden="true"></div>

    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
      <h1><span>Cyber</span><span>Monday</span></h1>
      <span class="lastday">Last day!</span>
      <p class="kicker">Black Friday prices on 35 STEM kits end tonight.</p>
    </div>

    <div class="sticker">
      <span class="upto">Up to</span>
      <span class="num">20%</span>
      <span class="off">off</span>
    </div>

    <div class="stage">
      <img class="deco atom" src="../../creative/kit/illustrations/atom-2.svg" alt="">
      <img class="deco nut" src="../../creative/kit/illustrations/nut-1.svg" alt="">
      <img class="vinci" src="images/vincibot-remote-box-cutout.png" alt="MatataStudio VinciBot and its box">
      <img class="build" src="images/robot-master-dinosaur-build.png" alt="A walking dinosaur robot built from the Makerzoid Robot Master kit">
      <img class="car" src="images/superbot-car-box-cutout.png" alt="A racing car built from the Makerzoid Superbot kit">
    </div>

    <div class="footer">
      <p><b>Monday 30 November</b>Free delivery over R 1,500</p>
      <span class="cta">Link in bio</span>
    </div>
  </main>
</body>
</html>
