<!DOCTYPE html>
<!--
  Black Friday lead, story (1080 x 1920). Adapted from
  feed-portrait-robot-master.html. Everything sits between the top 270px
  (profile name, progress bar) and the bottom 270px (reply bar, link sticker).
-->
<html lang="en-ZA" data-canvas="meta-story">
<head>
  <meta charset="utf-8">
  <title>200+ builds. One box. R 480 off.</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="sale.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas { padding: 250px var(--margin) 300px; }
    h1 { margin-top: 64px; font-size: 124px; }
    .body { font-size: 36px; }
    .card { margin-top: 48px; }
    .footer { margin-top: 48px; }
    .product { font-size: 34px; }
    .price b { font-size: 52px; }
    .price s { font-size: 32px; }
    .cta { height: 104px; font-size: 38px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="topbar">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-white.png" alt="CREATESPACE">
      <span class="sale-pill">Black Friday · ends 30 Nov</span>
    </div>

    <h1>
      <span><span class="marker">200+</span> builds.</span>
      <span>One box.</span>
      <span class="saving"><b>R 480</b> off.</span>
    </h1>

    <p class="body">Build a robot, code it with the app, take it apart and build the next. 600+ pieces in the case.</p>

    <div class="card hero">
      <img class="build" src="images/robot-master-dinosaur-build.png" alt="A walking dinosaur robot built from the Makerzoid Robot Master Premium kit">
      <img class="case" src="images/robot-master-premium-case.png" alt="Makerzoid Robot Master Premium storage case">
    </div>

    <div class="footer">
      <div>
        <p class="product">Makerzoid Robot Master Premium</p>
        <p class="price"><s>R 2,380</s><b>R 1,900</b><span class="age-pill">Ages 6 to 14</span></p>
      </div>
      <span class="cta">Shop the sale <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </main>
</body>
</html>
