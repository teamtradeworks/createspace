<!DOCTYPE html>
<!--
  Cyber Monday (last day of the Black Friday sale) newsletter hero.
  Email image (1200 x 800, shows at 600 x 400). Goes in the Image section at
  the top of the Shopify Messaging email (see
  cyber-monday-email-shopify-messaging.md), under a navy Header section.
  Option C: same left side as options A and B. On the right, three of the
  biggest savings fanned out as white cards (VinciBot, Robot Master Premium,
  Superbot), each with its live sale price on a red tag. Shows the range for
  the last day rather than one product. Prices checked on the site 27 Nov.
  No button and no logo on the image: the Header and Button sections carry
  those, so the email still works with images blocked.
-->
<html lang="en-ZA" data-canvas="email-hero">
<head>
  <meta charset="utf-8">
  <title>Cyber Monday: last day, up to 20% off STEM kits</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="sale.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      position: relative;
      padding: 76px 72px;
      background: var(--cs-navy);
      color: var(--cs-white);
    }

    .eyebrow {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cs-yellow);
    }

    h1 {
      margin: 22px 0 0;
      font-size: 126px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .tag {
      align-self: flex-start;
      margin-top: 36px;
      padding: 14px 30px 18px;
      border-radius: 14px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      transform: rotate(-2deg);
    }

    .sale-pill {
      align-self: flex-start;
      margin-top: 44px;
      font-size: 26px;
      padding: 17px 28px 18px;
    }

    .fan {
      position: absolute;
      top: 0;
      right: 0;
      width: 600px;
      height: 800px;
    }

    .kit {
      position: absolute;
      width: 250px;
      height: 300px;
      padding: 20px 20px 0;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 26px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .kit img {
      display: block;
      flex: none;
      width: 100%;
      height: 200px;
      object-fit: contain;
    }

    .kit .name {
      margin: 10px 0 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--cs-navy);
      white-space: nowrap;
    }

    .kit .price {
      position: absolute;
      bottom: -22px;
      padding: 10px 22px 12px;
      border-radius: 999px;
      background: var(--cs-red);
      color: #fff;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .kit.left  { left: 15px;  top: 300px; transform: rotate(-9deg); }
    .kit.right { left: 325px; top: 300px; transform: rotate(9deg); }
    .kit.mid   { left: 160px; top: 195px; z-index: 2; width: 280px; height: 340px; }
    .kit.mid img { height: 236px; }
  </style>
</head>
<body>
  <main class="canvas">
    <p class="eyebrow">Last day of the sale</p>
    <h1>Cyber<br>Monday</h1>
    <span class="tag">Up to 20% off</span>
    <span class="sale-pill">Ends tonight</span>
    <div class="fan">
      <div class="kit left"><img src="images/vincibot-robot-box-remote.jpg" alt=""><p class="name">VinciBot</p><span class="price">R 2,040</span></div>
      <div class="kit right"><img src="images/makerzoid-superbot-car-and-box.jpg" alt=""><p class="name">Superbot</p><span class="price">R 1,184</span></div>
      <div class="kit mid"><img src="images/robot-master-premium-case.png" alt=""><p class="name">Robot Master</p><span class="price">R 1,904</span></div>
    </div>
  </main>
</body>
</html>
