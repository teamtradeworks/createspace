<!DOCTYPE html>
<!--
  Cyber Monday (last day of the Black Friday sale) newsletter hero.
  Email image (1200 x 800, shows at 600 x 400). Goes in the Image section at
  the top of the Shopify Messaging email (see
  cyber-monday-email-shopify-messaging.md), under a navy Header section.
  Option G: same left side as the other options. On the right, our blue
  brand robot (creative/kit/illustrations/robot-2.svg) with brand elements
  floating round it on a faint dashed orbit (code, nut, lightbulb, planet,
  chip), in place of the yellow disc. Friendly and on brand, not product-led.
  No button and no logo on the image: the Header and Button sections carry
  those, so the email still works with images blocked.
-->
<html lang="en-ZA" data-canvas="email-hero">
<head>
  <meta charset="utf-8">
  <title>Cyber Monday: last day, up to 20% off STEM kits</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="sale.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      position: relative;
      padding: 76px 72px;
      background: var(--cs-navy);
      color: var(--cs-white);
    }

    .eyebrow {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cs-yellow);
    }

    h1 {
      margin: 22px 0 0;
      font-size: 126px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .tag {
      align-self: flex-start;
      margin-top: 36px;
      padding: 14px 30px 18px;
      border-radius: 14px;
      background: var(--cs-yellow);
      color: var(--cs-navy);
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      transform: rotate(-2deg);
    }

    .sale-pill {
      align-self: flex-start;
      margin-top: 44px;
      font-size: 26px;
      padding: 17px 28px 18px;
    }

    /* ring and icons, scaled down together round the robot's centre */
    .orbit-group {
      position: absolute;
      inset: 0;
      transform: scale(0.88);
      transform-origin: 880px 400px;
    }

    .orbit {
      position: absolute;
      top: 150px;
      right: 40px;
      width: 560px;
      height: 500px;
      border: 3px dashed rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .robot {
      position: absolute;
      /* centred in the orbit (centre 880, 400): 290 wide, about 304 tall */
      top: 248px;
      right: 175px;
      width: 290px;
      height: auto;
      transform: rotate(-6deg);
      filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.45));
    }

    .el {
      position: absolute;
      height: auto;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.35));
    }
    .el.code   { width: 120px; top: 118px; right: 455px; transform: rotate(-14deg); }
    .el.bulb   { width: 92px;  top: 96px;  right: 70px;  transform: rotate(14deg); }
    .el.nut    { width: 92px;  top: 380px; right: 40px;  transform: rotate(18deg); }
    .el.planet { width: 150px; top: 600px; right: 330px; transform: rotate(-8deg); }
    .el.chip   { width: 78px;  top: 440px; right: 535px; transform: rotate(-16deg); }
  </style>
</head>
<body>
  <main class="canvas">
    <p class="eyebrow">Last day of the sale</p>
    <h1>Cyber<br>Monday</h1>
    <span class="tag">Up to 20% off</span>
    <span class="sale-pill">Ends tonight</span>
    <div class="orbit-group">
      <div class="orbit"></div>
      <img class="el code" src="../../creative/kit/illustrations/code-1.svg" alt="">
      <img class="el bulb" src="../../creative/kit/illustrations/lightbulb.svg" alt="">
      <img class="el nut" src="../../creative/kit/illustrations/nut-2.svg" alt="">
      <img class="el planet" src="../../creative/kit/illustrations/planet-1.svg" alt="">
      <img class="el chip" src="../../creative/kit/illustrations/chip-2.svg" alt="">
    </div>
    <img class="robot" src="../../creative/kit/illustrations/robot-2.svg" alt="">
  </main>
</body>
</html>
