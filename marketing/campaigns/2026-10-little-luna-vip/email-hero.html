<!DOCTYPE html>
<!--
  Hero image for the Little Luna farewell email: a VIP pass for early
  Black Friday access, with the moon (Luna) passing the pass on to CREATESPACE.
  Render: marketing/scripts/render.sh marketing/campaigns/2026-10-little-luna-vip/email-hero.html
  Exports at 1200 x 628; the email shows it at 600px wide so it stays sharp on retina screens.
-->
<html lang="en-ZA" data-canvas="meta-landscape">
<head>
  <meta charset="utf-8">
  <title>Little Luna VIP pass</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    .canvas {
      background: var(--cs-navy);
      color: var(--cs-white);
      isolation: isolate;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
    }
    .glow--yellow { width: 380px; height: 380px; left: 20px; top: 110px; background: rgba(255, 213, 0, 0.16); }
    .glow--purple { width: 600px; height: 360px; left: 520px; top: 150px; background: rgba(172, 77, 255, 0.22); }

    .sky { position: absolute; inset: 0; width: 100%; height: 100%; }
    .orbit { fill: none; stroke: rgba(255, 255, 255, 0.22); stroke-width: 3; }
    .orbit--dots {
      stroke: rgba(255, 255, 255, 0.14);
      stroke-dasharray: 3 14;
      stroke-linecap: round;
      stroke-width: 4;
    }

    .piece { position: absolute; display: block; height: auto; }
    .moon  { width: 300px; left: 52px; top: 168px; }
    .atom  { width: 92px; left: 1068px; top: 40px; transform: rotate(12deg); }
    .nut   { width: 70px; left: 372px; top: 470px; transform: rotate(-16deg); }

    /* The pass */
    .pass {
      position: absolute;
      left: 420px;
      top: 134px;
      width: 700px;
      height: 360px;
      display: flex;
      transform: rotate(-4deg);
      filter: drop-shadow(0 26px 40px rgba(4, 8, 30, 0.55));
    }
    .pass__main {
      flex: 1;
      background: var(--cs-white);
      color: var(--cs-navy);
      border-radius: 28px 0 0 28px;
      padding: 46px 52px 44px;
      display: flex;
      flex-direction: column;
      /* notches where the stub tears off */
      -webkit-mask: radial-gradient(circle 22px at 100% 0, transparent 21px, #000 22px) top / 100% 51% no-repeat,
                    radial-gradient(circle 22px at 100% 100%, transparent 21px, #000 22px) bottom / 100% 51% no-repeat;
    }
    .pass__eyebrow {
      display: inline-flex;
      align-self: flex-start;
      align-items: center;
      gap: 10px;
      padding: 8px 18px 9px;
      border-radius: 999px;
      background: var(--cs-navy);
      color: var(--cs-yellow);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .pass__eyebrow svg { width: 20px; height: 20px; }
    .pass__title {
      margin: 26px 0 0;
      font-weight: 600;
      font-size: 100px;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -0.03em;
    }
    .pass__sub {
      margin: auto 0 0;
      font-size: 32px;
      white-space: nowrap;
      line-height: 1.2;
    }
    .pass__sub strong { font-weight: 600; color: var(--cs-orange); }

    .pass__stub {
      width: 140px;
      background: var(--cs-orange);
      border-radius: 0 28px 28px 0;
      border-left: 4px dashed rgba(12, 20, 70, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-mask: radial-gradient(circle 22px at 0 0, transparent 21px, #000 22px) top / 100% 51% no-repeat,
                    radial-gradient(circle 22px at 0 100%, transparent 21px, #000 22px) bottom / 100% 51% no-repeat;
    }
    .pass__stub span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-weight: 700;
      font-size: 86px;
      letter-spacing: 0.08em;
      color: var(--cs-white);
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow glow--yellow"></div>
    <div class="glow glow--purple"></div>

    <svg class="sky" viewBox="0 0 1200 628" aria-hidden="true">
      <g id="stars"></g>
      <ellipse class="orbit orbit--dots" cx="640" cy="330" rx="700" ry="300" transform="rotate(-8 640 330)"/>
      <ellipse class="orbit" cx="560" cy="320" rx="520" ry="190" transform="rotate(-8 560 320)"/>
    </svg>

    <img class="piece moon" src="../../creative/kit/illustrations/planet-2.svg" alt="">
    <img class="piece atom" src="../../creative/kit/illustrations/atom-2.svg" alt="">
    <img class="piece nut" src="../../creative/kit/illustrations/nut-2.svg" alt="">

    <div class="pass">
      <div class="pass__main">
        <span class="pass__eyebrow">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.6l-6.4 3.5L7 14l-5.3-5 7.2-.9z"/></svg>
          Early access
        </span>
        <h1 class="pass__title">Black Friday</h1>
        <p class="pass__sub">For <strong>CREATESPACE subscribers</strong> only</p>
      </div>
      <div class="pass__stub"><span>VIP</span></div>
    </div>
  </main>

  <script>
    // A fixed, seeded star field so every render is identical.
    (function () {
      var seed = 11;
      function rand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }
      var g = document.getElementById("stars");
      var ns = "http://www.w3.org/2000/svg";
      for (var i = 0; i < 80; i++) {
        var x = rand() * 1200;
        var y = rand() * 628;
        if (x > 400 && x < 1140 && y > 100 && y < 520) continue; // behind the pass
        var c = document.createElementNS(ns, "circle");
        var big = rand() > 0.85;
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", big ? 3.2 : 1.8);
        c.setAttribute("fill", "#fff");
        c.setAttribute("opacity", (big ? 0.7 : 0.25 + rand() * 0.35).toFixed(2));
        g.appendChild(c);
      }
    })();
  </script>
</body>
</html>
