<!DOCTYPE html>
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>CREATESPACE: The gift that keeps building (feed portrait)</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="assembly.css">
  <script src="../../creative/kit/canvas.js"></script>
</head>
<body>
  <main class="canvas">
    <div class="glow glow-blue" aria-hidden="true"></div>
    <div class="glow glow-purple" aria-hidden="true"></div>

    <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">

    <h1 class="headline">The gift that keeps <em>building.</em></h1>
    <p class="sub">200+ robots in one box.</p>

    <section class="sheet" aria-label="Assembly instructions">
      <header class="sheet-head">
        <span class="sheet-title">Assembly instructions</span>
        <span class="sheet-meta">Christmas morning onwards</span>
      </header>

      <ol class="steps">
        <li class="step">
          <figure class="frame"><img src="images/girls-opening-robot-master-at-christmas.jpg" alt="Two sisters opening a Makerzoid Robot Master box in front of the Christmas tree" style="object-position: 50% 42%"></figure>
          <p class="cap"><span class="num">1</span>Unwrap it.</p>
          <svg class="arrow" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 20 H30 M21 11 L30 20 L21 29" /></svg>
        </li>
        <li class="step">
          <figure class="frame"><img src="images/kids-building-makerzoid-robot-on-floor.jpg" alt="Two children building a robot on the floor, parts and a tablet around them" style="object-position: 50% 72%"></figure>
          <p class="cap"><span class="num">2</span>Build it.</p>
        </li>
        <li class="step">
          <figure class="frame"><img src="images/boy-coding-makerzoid-robot-on-tablet.jpg" alt="A boy coding his robot on a tablet, his builds on the rug behind him" style="object-position: 50% 76%; transform: scale(1.1); transform-origin: 50% 70%"></figure>
          <p class="cap"><span class="num">3</span>Code it.</p>
          <svg class="arrow" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 20 H30 M21 11 L30 20 L21 29" /></svg>
        </li>
        <li class="step">
          <figure class="frame"><img src="images/makerzoid-helicopter-build-with-manual.jpg" alt="A finished robot helicopter beside the parts tray and the open build manual" style="object-position: 70% 70%; transform: scale(1.25); transform-origin: 68% 66%"></figure>
          <p class="cap"><span class="num">4</span>Build the next one.</p>
        </li>
      </ol>
    </section>

    <footer class="footer">
      <div class="facts">
        <p class="fact-main">Makerzoid Robot Master Premium</p>
        <p class="fact-sub">Ages 6-14 · Free delivery over R 1,500</p>
      </div>
      <span class="cta">Shop the kit
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 H19 M13 6 L19 12 L13 18" /></svg>
      </span>
    </footer>
  </main>
</body>
</html>
