<!DOCTYPE html>

<head>

<title>CREATESPACE: Anatomy you can hold</title>

<body>
<main class="canvas c-body" aria-label="CREATESPACE: National Geographic Glow-in-the-Dark Human Body, anatomy you can hold">
  <img class="logo" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
  <h1>Anatomy you can <em>hold.</em></h1>
  <div class="diptych">
    <figure class="pane pane--on">
      <img src="images/body-model-on-navy.jpg" alt="The Glow-in-the-Dark Human Body model on its stand, with organs and bones inside a clear shell">
      <span class="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg> Lights on</span>

    <figure class="pane pane--off">
      <img src="images/body-skeleton-glowing.jpg" alt="The same model in the dark, its skeleton glowing green">

    </figure>

  <footer class="buy">
    <p class="what">National Geographic Glow-in-the-Dark Human Body<span class="price"><b>R 600</b><span class="age-chip">Ages 8-12</span></span></p>
    <span class="cta">See inside <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
