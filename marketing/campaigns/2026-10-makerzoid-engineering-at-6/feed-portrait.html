<!DOCTYPE html>
<!--
  Ad brief A3: "Engineering at 6. 200 robots deep." Meta feed portrait (1080 x 1350).
  Age and skill series (A1-A6). The layout lives in age-series.css and stays
  identical across the series; this ad sets the green accent, its copy and
  the Robot Master Premium box.
-->
<html lang="en-ZA" data-canvas="meta-portrait">
<head>
  <meta charset="utf-8">
  <title>Engineering at 6</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <link rel="stylesheet" href="age-series.css">
  <script src="../../creative/kit/canvas.js"></script>
  <style>
    :root {
      --accent: var(--cs-green);
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="top">
      <img class="wordmark" src="../../creative/kit/logo/logo-on-navy.png" alt="CREATESPACE">
      <p class="series">Junior Innovators 6-8</p>
    </div>

    <h1>
      <span>Engineering at <span class="age">6</span>.</span>
      <span>200 robots deep.</span>
    </h1>

    <p class="body">They build it, then code it with Scratch blocks. Then they take it apart and build the next one.</p>

    <ul class="pills">
      <li>Ages 6-14</li>
      <li>200+ models</li>
      <li>Scratch 3.0</li>
    </ul>

    <div class="card">
      <img src="images/makerzoid-robot-master-premium-box.jpg" alt="Makerzoid Robot Master Premium storage box, showing the robots you can build">
    </div>

    <div class="footer">
      <div>
        <p class="product">Makerzoid Robot Master Premium</p>
        <p class="price"><b>R 2,380</b> | thecreatespace.co.za</p>
      </div>
      <span class="cta">Shop now</span>
    </div>
  </main>
</body>
</html>
