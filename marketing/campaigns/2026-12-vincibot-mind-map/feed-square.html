<!DOCTYPE html>
<html lang="en-ZA" data-canvas="meta-square">
<head>
  <meta charset="utf-8">
  <title>VinciBot mind map, feed square</title>
  <link rel="stylesheet" href="../../creative/kit/brand.css">
  <script src="../../creative/kit/canvas.js"></script>
  <link rel="stylesheet" href="mind-map.css">
  <style>
    /* Square: less height than the portrait, so there is no logo (the page name shows
       above the ad in the feed) and the CTA sits centred under the hub, between the bottom nodes. */
    .canvas {
      --hub: 280px;
      --pic: 160px;
      background:
        radial-gradient(460px 380px at 540px 580px, rgba(60, 199, 247, 0.22), transparent 70%),
        radial-gradient(380px 320px at 880px 260px, rgba(172, 77, 255, 0.16), transparent 70%),
        var(--cs-navy);
    }
    .head {
      position: absolute;
      top: 44px;
      left: 64px;
      right: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kicker { font-size: 26px; padding: 10px 24px; }
    .top { top: 118px; left: 40px; right: 40px; }
    h1 { margin: 0; font-size: 60px; }
    .branches { height: 1080px; }
    .hub { left: 540px; top: 580px; }
    .hub-name { font-size: 30px; bottom: -24px; }
    .bow { width: 128px; top: -50px; }
    .node { width: 270px; margin-left: -135px; }
    .node .pic { border-width: 7px; }
    .node .label { font-size: 28px; margin-top: 10px; }
    .chip { font-size: 24px; padding: 6px 16px; }
    .cta-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 52px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="canvas">

    <div class="head">
      <span class="kicker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="currentColor"/></svg>
        Christmas gift idea · Ages 8-12
      </span>
    </div>

    <header class="top">
      <h1>One gift. <em>So many ways to play.</em></h1>
    </header>

    <!-- Branches: hub centre is (540, 580). Node picture centres sit at the path ends. -->
    <svg class="branches" viewBox="0 0 1080 1080" aria-hidden="true">
      <path d="M 540 580 Q 380 440 170 320" stroke="#FFD500"/>
      <path d="M 540 580 Q 350 572 140 580" stroke="#93DB21"/>
      <path d="M 540 580 Q 380 700 170 840" stroke="#3CC7F7"/>
      <path d="M 540 580 Q 700 440 910 320" stroke="#AC4DFF"/>
      <path d="M 540 580 Q 730 572 940 580" stroke="#FF8B00"/>
      <path d="M 540 580 Q 700 700 910 840" stroke="#FFFFFF"/>
      <!-- sub-branches to the chips -->
      <path d="M 345 576 Q 336 550 322 522" stroke="#93DB21" stroke-width="4"/>
      <path d="M 365 704 Q 380 770 400 826" stroke="#3CC7F7" stroke-width="4"/>
    </svg>

    <!-- Hub -->
    <div class="hub">
      <svg class="bow" viewBox="0 0 150 80" aria-hidden="true">
        <path d="M75 52 C 50 10, 8 8, 12 38 C 16 64, 55 60, 75 52 Z" fill="#F70B28"/>
        <path d="M75 52 C 100 10, 142 8, 138 38 C 134 64, 95 60, 75 52 Z" fill="#F70B28"/>
        <path d="M75 52 C 62 62, 52 74, 44 80 M75 52 C 88 62, 98 74, 106 80" stroke="#F70B28" stroke-width="9" stroke-linecap="round" fill="none"/>
        <circle cx="75" cy="50" r="13" fill="#C10820"/>
      </svg>
      <img src="images/vincibot-front-white.jpg" alt="VinciBot coding robot">
      <span class="hub-name">VinciBot</span>
    </div>

    <!-- Nodes (top = picture top; picture centre = top + 80) -->
    <div class="node" style="left:170px; top:240px; --c: var(--cs-yellow)">
      <div class="pic"><img src="images/vincibot-drawing-plane.jpg" alt="VinciBot holding a marker beside the plane it drew"></div>
      <div class="label">Draws pictures</div>
    </div>
    <div class="node" style="left:140px; top:500px; --c: var(--cs-green)">
      <div class="pic"><img src="images/vincibot-following-line.jpg" alt="VinciBot following a black line track"></div>
      <div class="label">Follows lines</div>
    </div>
    <div class="node" style="left:170px; top:760px; --c: var(--cs-blue)">
      <div class="pic"><img src="images/blocks-and-python-code.jpg" alt="The same VinciBot program in blocks and in Python"></div>
      <div class="label">Blocks first,<br>then Python</div>
    </div>
    <div class="node" style="left:910px; top:240px; --c: var(--cs-purple)">
      <div class="pic"><img src="images/vincibot-lights-music.jpg" alt="VinciBot with glowing ears, dancing to music"></div>
      <div class="label">Lights up and<br>plays music</div>
    </div>
    <div class="node" style="left:940px; top:500px; --c: var(--cs-orange)">
      <div class="pic"><img src="images/vincibot-lego-build.jpg" alt="VinciBot built into a LEGO conveyor"></div>
      <div class="label">Builds with<br>LEGO bricks</div>
    </div>
    <div class="node" style="left:910px; top:760px; --c: var(--cs-white)">
      <div class="pic"><img src="images/vincibot-with-remote.jpg" alt="Hand pointing the remote at VinciBot"></div>
      <div class="label">Drives by remote</div>
    </div>

    <!-- Chips -->
    <span class="chip" style="left:226px; top:478px; --c: var(--cs-green)"><b>8</b> sensors</span>
    <span class="chip" style="left:330px; top:826px; --c: var(--cs-blue)"><b>93</b> activities</span>

    <!-- Sparkles -->
    <svg class="spark" style="left:690px; top:380px; width:22px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
    <svg class="spark" style="left:660px; top:850px; width:28px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
    <svg class="spark" style="left:400px; top:224px; width:24px" viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>

    <div class="cta-wrap"><span class="cta">Shop VinciBot</span></div>

  </main>
</body>
</html>
